<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>PROCESS STUDIO · 작전판 + 훈련 일정</title>
<meta name="description" content="코치를 위한 스튜디오. 작전판으로 전술을 그리고, 경기일 기준으로 훈련 일정을 자동 주기화하세요. 카카오·구글 로그인으로 클라우드에 저장.">
<meta property="og:type" content="website">
<meta property="og:title" content="PROCESS STUDIO">
<meta property="og:description" content="작전판 · 훈련 일정 · 게임 모델. 코치를 위한 스튜디오를 브라우저에서 바로.">
<meta property="og:locale" content="ko_KR">
<meta name="theme-color" content="#070708">
<link rel="icon" type="image/png" href="/icon-512.png">
<link rel="manifest" href="/manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PROCESS">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@100;200;300;400;600;800;900&family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
</head>
<body>
<!-- 부팅 스플래시: React 마운트 전부터 즉시 표시, 보드 준비되면 셸이 페이드 제거 -->
<style>
  #cs-splash{position:fixed;inset:0;z-index:9999;background:#ECEDF0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:18px;transition:opacity .35s ease;font-family:'Montserrat','Noto Sans KR',-apple-system,sans-serif;}
  #cs-splash .csl-brand{font-family:'Jost','Montserrat',sans-serif;font-weight:300;font-size:22px;letter-spacing:.04em;color:#16181C;}
  #cs-splash .csl-brand b{font-weight:700;}
  #cs-splash .csl-spin{width:26px;height:26px;border-radius:50%;border:3px solid #d6d9e0;border-top-color:#3a6df0;animation:csl-rot .7s linear infinite;}
  #cs-splash .csl-txt{font-size:12.5px;font-weight:600;color:#5C6068;letter-spacing:.02em;}
  @keyframes csl-rot{to{transform:rotate(360deg);}}
</style>
<div id="cs-splash">
  <div class="csl-brand"><b>PRO</b>CESS <b>STUDIO</b></div>
  <div class="csl-spin"></div>
  <div class="csl-txt">불러오는 중…</div>
</div>
<script>
  // 안전장치: 8초 내 셸이 못 지우면 강제 제거(흰 화면 갇힘 방지)
  setTimeout(function(){var s=document.getElementById('cs-splash');if(s){s.style.opacity='0';setTimeout(function(){s&&s.remove();},400);}},8000);
</script>
<div id="root"></div>
<!-- 셸(부모)도 백업 등에서 IndexedDB(window.storage)에 접근 -->
<script src="/studio/idb-store.js"></script>
<!-- 다국어(ko/ja/en/zh/es/pt): document 를 register 하고 React 마운트를 MutationObserver 로 번역 -->
<script src="/studio/i18n.js"></script>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
