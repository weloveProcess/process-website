<!DOCTYPE html>
<html lang="ko">
<head>
<!-- PROCESS — 게임모델 (프로토타입 v1) -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<style>
:focus-visible{outline:2px solid #3a6df0 !important;outline-offset:2px;border-radius:6px;}

  :root{
    --bg:#ECEDF0; --frame:#FFFFFF; --surface:#FFFFFF; --surface-2:#F1F2F4;
    --line:#E3E5E9; --line-soft:#ECEDF0;
    --text:#16181C; --text-2:#5C6068; --text-3:#767B85;
    --accent:#3a6df0; --accent-dim:#bcd0fb; --accent-soft:#edf2fe;
    --ao:#2E7D63; --ao-soft:#E8F3EE; --ao-line:#BEE0D2;
    --do:#C24A46; --do-soft:#FBEBEA; --do-line:#F0C2BF;
    --dt:#B5762B; --dt-soft:#FBF1E0; --dt-line:#E9CB97;
    --at:#3a6df0; --at-soft:#edf2fe; --at-line:#bcd0fb;
    --r:14px; --r-sm:9px;
    --f:-apple-system,BlinkMacSystemFont,system-ui,'Apple SD Gothic Neo','Malgun Gothic','Segoe UI',Roboto,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{background:var(--bg);font-family:var(--f);color:var(--text);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;line-height:1.5}
  body{display:block;min-height:100dvh}

  .phone{width:100%;max-width:100%;background:transparent;overflow:hidden;position:relative;display:flex;flex-direction:column;height:100dvh}
  .stage{flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .stage::-webkit-scrollbar{display:none}

  /* ---------- top bar ---------- */
  .gmtop{position:sticky;top:0;z-index:30;background:var(--frame);border-bottom:1px solid var(--line);
    padding:max(12px,env(safe-area-inset-top)) 22px 12px;display:flex;align-items:center;gap:12px}
  .gmtop .t{flex:1;min-width:0}
  .gmtop .t h1{font-size:17px;font-weight:800;letter-spacing:-.2px}
  .gmtop .t small{display:block;color:var(--text-3);font-size:11.5px;font-weight:600;letter-spacing:.02em;margin-top:1px}
  .iconbtn{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);color:var(--text-2);
    width:36px;height:36px;border-radius:11px;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .iconbtn:active{transform:scale(.94)}

  /* ---------- identity card (collapsible) ---------- */
  .idcard{margin:14px 22px 0;background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r);overflow:hidden}
  .idhead{display:flex;align-items:center;gap:10px;padding:12px 15px;cursor:pointer;user-select:none}
  .idhead:active{background:var(--surface-2)}
  .idcard .lab{flex:0 0 auto;font-size:11px;font-weight:800;letter-spacing:.08em;color:var(--text-3);text-transform:uppercase}
  .idcard .idprev{flex:1;min-width:0;font-size:12.5px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:right}
  .idcard .idprev.placeholder{color:var(--text-3)}
  .idcard.open .idprev{display:none}
  .idcard .chev{flex:0 0 auto;color:var(--text-3);font-size:13px;transition:.2s}
  .idcard.open .chev{transform:rotate(90deg)}
  .idcard textarea{display:none;width:100%;border:0;outline:0;resize:none;background:transparent;font-family:var(--f);
    font-size:14px;line-height:1.5;color:var(--text);padding:0 15px 13px;min-height:20px;max-height:120px;overflow:auto}
  .idcard.open textarea{display:block}
  .idcard textarea::placeholder{color:var(--text-3)}

  /* ---------- moment section ---------- */
  .moment{margin:14px 22px 0}
  .mhead{display:flex;align-items:center;gap:10px;padding:13px 15px;border-radius:var(--r);
    border:1px solid var(--line);background:var(--surface);cursor:pointer;user-select:none}
  .moment.open .mhead{border-bottom-left-radius:0;border-bottom-right-radius:0}
  .mdot{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
  .mhead .mtitle{flex:1;font-size:14.5px;font-weight:700;letter-spacing:-.1px}
  .mhead .mtag{font-size:10.5px;font-weight:800;letter-spacing:.06em;padding:3px 8px;border-radius:6px}
  .mhead .chev{color:var(--text-3);font-size:13px;transition:.2s;flex:0 0 auto}
  .moment.open .mhead .chev{transform:rotate(90deg)}
  .mbody{display:none;border:1px solid var(--line);border-top:0;border-radius:0 0 var(--r) var(--r);
    background:var(--surface-2);padding:12px 12px 14px}
  .moment.open .mbody{display:block}

  /* moment color variants */
  .m-ao .mdot{background:var(--ao)} .m-ao .mtag{background:var(--ao-soft);color:var(--ao)}
  .m-do .mdot{background:var(--do)} .m-do .mtag{background:var(--do-soft);color:var(--do)}
  .m-dt .mdot{background:var(--dt)} .m-dt .mtag{background:var(--dt-soft);color:var(--dt)}
  .m-at .mdot{background:var(--at)} .m-at .mtag{background:var(--at-soft);color:var(--at)}

  /* ---------- phase card ---------- */
  .phase{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:11px 12px;margin-bottom:9px}
  .phase:last-child{margin-bottom:0}
  .phead{display:flex;align-items:center;gap:8px}
  .pname{flex:1;border:0;outline:0;background:transparent;font-family:var(--f);font-size:13.5px;font-weight:700;color:var(--text);padding:2px 0}
  .pdel{border:0;background:transparent;color:var(--text-3);font-size:15px;cursor:pointer;padding:4px 8px;margin:-2px -4px;line-height:1;border-radius:6px}
  .pdel:active{background:var(--surface-2)}
  .pdel:hover{color:var(--do)}
  .princ{margin-top:8px;display:flex;flex-direction:column;gap:6px}
  .prow{display:flex;align-items:flex-start;gap:8px}
  .prow .b{flex:0 0 auto;color:var(--text-3);font-weight:800;font-size:13px;line-height:1.5;margin-top:1px}
  .prow textarea{flex:1;border:0;outline:0;resize:none;background:transparent;font-family:var(--f);
    font-size:13.5px;line-height:1.5;color:var(--text);min-height:20px;overflow:hidden}
  .prow textarea::placeholder{color:var(--text-3)}
  .prow .x{flex:0 0 auto;border:0;background:transparent;color:var(--text-3);font-size:15px;cursor:pointer;
    padding:4px 7px;margin:-3px -5px -3px 0;opacity:.5;transition:.15s;line-height:1;border-radius:6px}
  .prow .x:active{transform:scale(.9);background:var(--surface-2)}
  @media (hover:hover){ .prow .x{opacity:0} .prow:hover .x{opacity:1} }
  .addprinc{margin-top:7px;border:1px dashed var(--line);background:transparent;color:var(--text-2);
    font-family:var(--f);font-size:12.5px;font-weight:600;border-radius:7px;padding:7px 10px;cursor:pointer;width:100%}
  .addprinc:active{background:var(--surface-2)}

  /* snapshot */
  .snapwrap{margin-top:9px;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
  .snapthumb{position:relative;width:88px;height:58px;border-radius:7px;overflow:hidden;border:1px solid var(--line);background:var(--surface-2)}
  .snapthumb img{width:100%;height:100%;object-fit:cover;display:block}
  .snapthumb .rm{position:absolute;top:3px;right:3px;width:18px;height:18px;border-radius:50%;border:0;
    background:rgba(22,24,28,.62);color:#fff;font-size:11px;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1}
  .attachbtn{border:1px solid var(--line);background:var(--surface);color:var(--accent);
    font-family:var(--f);font-size:12px;font-weight:700;border-radius:7px;padding:7px 11px;cursor:pointer;display:inline-flex;align-items:center;gap:5px}
  .attachbtn:active{background:var(--accent-soft)}

  .addphase{margin-top:4px;border:1px dashed var(--line);background:transparent;color:var(--text-2);
    font-family:var(--f);font-size:12.5px;font-weight:700;border-radius:8px;padding:9px;cursor:pointer;width:100%}
  .addphase:active{background:var(--surface)}

  .foot{padding:22px 22px max(26px,env(safe-area-inset-bottom));text-align:center;color:var(--text-3);font-size:11px;font-weight:600;letter-spacing:.02em}

  /* ---------- small-phone fit: reclaim side gutters so content has room ---------- */
  @media (max-width:430px){
    .gmtop{padding-left:16px;padding-right:16px}
    .idcard,.moment{margin-left:13px;margin-right:13px}
    .foot{padding-left:16px;padding-right:16px}
  }
  .mhead:active{background:var(--surface-2)}

  /* ---------- print / document view ---------- */
  @media print{
    @page{margin:14mm}
    body{background:#fff}
    .gmtop,.iconbtn,.addphase,.addprinc,.pdel,.prow .x,.attachbtn,.snapthumb .rm,.foot,.gm-docbar{display:none!important}
    .phone,.stage{height:auto;overflow:visible;display:block}
    .moment .mbody{display:block!important}
    .moment{break-inside:avoid;margin:18px 0 0}
    .idcard,.moment{margin-left:0;margin-right:0}
    .mhead{cursor:default}
    .mhead .chev{display:none}
    .phase{break-inside:avoid}
    .prdoc{display:block!important}
    /* drop unfilled rows so the printed document reads clean */
    .prow:has(textarea:placeholder-shown){display:none}
    .idcard:has(textarea:placeholder-shown){display:none}
    .idcard .chev,.idcard .idprev{display:none!important}
    .idcard textarea{display:block!important;max-height:none!important;overflow:visible!important;padding-top:2px}
  }
  .prdoc{display:none}

.mhead .mtitle{flex:0 1 auto}
.mhead .chev{margin-left:auto}





/*FMDARK*/
body.fmdark{--bg:#0F141B!important;--frame:#1A212B!important;--surface:#1A212B!important;--surface-2:#232C38!important;--line:#2C3744!important;--line-soft:#232C38!important;--text:#E7EBF1!important;--text-2:#9AA4B3!important;--text-3:#7C8696!important;--accent:#4D7DFF!important;--accent-dim:#2F4D8A!important;--accent-soft:rgba(77,125,255,.16)!important;background:#0F141B!important;color:#E7EBF1!important}
/*ENDFMDARK*/
</style>
<style>
/* ===== UNIFIED APP HEADER — shared pattern across sub-apps ===== */
.apphd{flex:0 0 auto;display:flex;align-items:center;gap:14px;
  padding:9px 14px;padding-top:max(9px,env(safe-area-inset-top));
  background:#FFFFFF;border-bottom:1px solid #E3E5E9;
  box-shadow:0 1px 2px rgba(16,24,40,.06);position:sticky;top:0;z-index:40;}
.apphd-name{display:flex;align-items:center;line-height:1;white-space:nowrap;color:#16181C;
  font-weight:800;font-size:15px;letter-spacing:-.2px;flex:0 0 auto;}
.apphd-name .sub{font-size:12px;font-weight:700;color:#5C6068;margin-left:9px;letter-spacing:-.2px;}
.apphd-name .wm{font-weight:300;letter-spacing:.04em;}
.apphd-name .wm b{font-weight:800;}
.apphd-seg{display:flex;background:#F1F2F4;border:1px solid #E3E5E9;border-radius:11px;
  padding:3px;gap:2px;margin-left:0;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none;flex:0 1 auto;}
.apphd-seg::-webkit-scrollbar{display:none;}
.apphd-seg button{border:0;background:transparent;color:#5C6068;font-weight:600;font-size:14px;
  letter-spacing:-.2px;padding:8px 16px;border-radius:9px;cursor:pointer;transition:.15s;
  white-space:nowrap;font-family:inherit;flex:0 0 auto;}
.apphd-seg button.on{background:#fff;color:#16181C;box-shadow:0 1px 2px rgba(16,24,40,.08),0 2px 5px rgba(16,24,40,.06);}
.apphd-seg button:not(.on):hover{color:#16181C;}
.apphd-act{margin-left:auto;display:flex;align-items:center;gap:8px;flex:0 0 auto;}
.apphd-iconbtn{border:1px solid #E3E5E9;background:#F1F2F4;color:#16181C;height:34px;min-width:34px;
  padding:0 13px;border-radius:10px;font-weight:700;font-size:13px;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;font-family:inherit;transition:.15s;}
.apphd-iconbtn:hover{background:#fff;}.apphd-iconbtn:active{transform:scale(.96);}
@media (max-width:520px){.apphd{gap:9px;padding:8px 12px;}.apphd-name .sub{display:none;}}
@media print{.apphd{display:none!important;}}
</style>
</head>
<body>
<div class="phone">
  <div class="stage" id="stage">

    <div class="apphd">
      
      <div class="apphd-seg" id="gmNav">
        <button data-v="team">팀 구성</button>
        <button data-v="players" style="display:none">선수</button>
        <button data-v="report">스카우트</button>
        <button data-v="gamemodel" class="on">게임모델</button>
        <button data-v="positions">기준 설정</button>
      </div>
    </div>

    <!-- title shown only when printing -->
    <div class="prdoc" style="padding:0 0 4px"><h1 style="font-size:22px;font-weight:800" id="prTitle">게임모델</h1></div>

    <div class="idcard" id="idcard">
      <div class="idhead" id="idHead">
        <span class="lab">팀 정체성</span>
        <span class="idprev" id="idPrev"></span>
        <span class="chev">▸</span>
      </div>
      <textarea id="identity" placeholder="우리 팀을 한 문장으로 — 예: 적극적으로 전방에서 압박하고, 측면을 통해 빠르게 전진한다. (선택)"></textarea>
    </div>

    <div id="moments"></div>

    <div class="gm-docbar" style="display:flex;justify-content:flex-end;margin:20px 22px 4px">
      <button class="apphd-iconbtn" id="btnDoc" title="PDF로 내보내기">⤓ PDF로 내보내기</button>
    </div>
    <div class="foot">프로토타입 v1 · 모든 내용은 코치가 직접 정의합니다 · 평가·추천 없음</div>
  </div>
</div>

<script src="idb-store.js"></script>
<script>
(async function(){
  var LS='cs_gamemodel_v1';
  var stage=document.getElementById('stage');
  var momentsEl=document.getElementById('moments');
  var identityEl=document.getElementById('identity');

  // ---- default skeleton (baseline, not ceiling) ----
  function seed(){
    var uid=function(){return 'p'+Math.random().toString(36).slice(2,8)};
    var P=function(name){return {id:uid(),name:name,principles:[''],snap:null}};
    return {
      identity:'',
      open:{ao:false,do:false,dt:false,at:false},
      moments:[
        {key:'ao',name:'공격 조직',tag:'IN POSSESSION',phases:[P('빌드업'),P('전진 · 전개'),P('침투 · 마무리')]},
        {key:'do',name:'수비 조직',tag:'OUT OF POSS',phases:[P('전방 압박'),P('미드 블록'),P('로우 블록')]},
        {key:'dt',name:'공격 → 수비 전환',tag:'TRANSITION −',phases:[P('즉시 반응 (역압박)'),P('후퇴 · 재정비')]},
        {key:'at',name:'수비 → 공격 전환',tag:'TRANSITION +',phases:[P('빠른 역습'),P('점유 안정화')]}
      ]
    };
  }

  var model=seed();
  try{
    var raw=null;
    if(window.storage){ var r=await window.storage.get(LS); raw=r?r.value:null; }
    else { try{ raw=localStorage.getItem(LS); }catch(_){} }
    if(raw){ var m=JSON.parse(raw); if(m) model=m; }
  }catch(e){}
  if(!model || typeof model!=='object' || !Array.isArray(model.moments)) model=seed();   // 잘못된 형태의 저장 데이터 방어
  model.open={ao:false,do:false,dt:false,at:false};   // 진입 시 항상 접힘으로 시작

  // 로컬 작업 버퍼: IndexedDB(window.storage) 우선, localStorage 폴백 + 로그인 시 부모(셸)가 Supabase 동기화
  function save(){
    var json=null; try{ json=JSON.stringify(model); }catch(e){}
    if(json!=null){
      if(window.storage){ window.storage.set(LS,json).catch(function(){ try{localStorage.setItem(LS,json);}catch(_){} }); }
      else { try{ localStorage.setItem(LS,json); }catch(_){} }
    }
    try{parent.postMessage({source:'gamemodel',type:'cloudSave',kind:'gamemodel',payload:json},'*');}catch(_){}
  }

  function autosize(ta){ ta.style.height='auto'; ta.style.height=ta.scrollHeight+'px'; }

  function render(){
    momentsEl.innerHTML='';
    model.moments.forEach(function(m){
      var sec=document.createElement('div');
      sec.className='moment m-'+(m.cat||m.key)+(model.open[m.key]?' open':'');
      var CATS=['ao','do','dt','at'];

      var head=document.createElement('div');
      head.className='mhead';
      function _ctl(txt,title){var b=document.createElement('button');b.textContent=txt;b.title=title;b.style.cssText='border:0;background:transparent;color:var(--text-3);font-size:13px;cursor:pointer;padding:3px 5px;line-height:1;border-radius:6px';b.addEventListener('click',function(e){e.stopPropagation();});return b;}
      var dot=document.createElement('button'); dot.className='mdot'; dot.title='색/구분 바꾸기'; dot.style.cssText='border:0;padding:0;cursor:pointer';
      dot.addEventListener('click',function(e){e.stopPropagation(); var c=m.cat||m.key; var i=CATS.indexOf(c); m.cat=CATS[(i+1)%CATS.length]; save(); render();});
      var nm=document.createElement('input'); nm.className='mtitle'; nm.value=m.name||''; nm.placeholder='국면 이름';
      nm.style.cssText='border:0;outline:0;background:transparent;font-family:inherit;font-size:14.5px;font-weight:700;letter-spacing:-.1px;color:var(--text);min-width:50px';
      nm.addEventListener('click',function(e){e.stopPropagation();});
      nm.addEventListener('input',function(){m.name=nm.value;save();});
      var tag=document.createElement('input'); tag.className='mtag'; tag.value=m.tag||''; tag.placeholder='태그';
      tag.size=Math.max(4,(m.tag||'').length||4);
      tag.style.cssText='border:0;outline:0;font-family:inherit;font-size:10.5px;font-weight:800;letter-spacing:.06em;text-align:center';
      tag.addEventListener('click',function(e){e.stopPropagation();});
      tag.addEventListener('input',function(){m.tag=tag.value;tag.size=Math.max(4,tag.value.length||4);save();});
      var up=_ctl('▲','위로'); up.addEventListener('click',function(){var i=model.moments.indexOf(m);if(i>0){model.moments.splice(i,1);model.moments.splice(i-1,0,m);save();render();}});
      var dn=_ctl('▼','아래로'); dn.addEventListener('click',function(){var i=model.moments.indexOf(m);if(i<model.moments.length-1){model.moments.splice(i,1);model.moments.splice(i+1,0,m);save();render();}});
      var mdel=_ctl('✕','국면 삭제'); mdel.addEventListener('click',function(){ if(!confirm('이 국면 전체를 삭제할까요?'))return; var i=model.moments.indexOf(m); if(i>-1)model.moments.splice(i,1); try{delete model.open[m.key];}catch(_){} save(); render(); });
      var chev=document.createElement('span'); chev.className='chev'; chev.textContent='▸';
      head.appendChild(dot); head.appendChild(nm); head.appendChild(tag); head.appendChild(up); head.appendChild(dn); head.appendChild(mdel); head.appendChild(chev);
      head.addEventListener('click',function(){
        model.open[m.key]=!model.open[m.key]; sec.classList.toggle('open'); save();
        if(model.open[m.key]) [].forEach.call(sec.querySelectorAll('textarea'),autosize);
      });
      sec.appendChild(head);

      var body=document.createElement('div');
      body.className='mbody';

      m.phases.forEach(function(ph){ body.appendChild(phaseCard(m,ph)); });

      var addp=document.createElement('button');
      addp.className='addphase'; addp.textContent='＋ 단계 추가';
      addp.addEventListener('click',function(){
        m.phases.push({id:'p'+Math.random().toString(36).slice(2,8),name:'새 국면',principles:[''],snap:null});
        save(); render();
      });
      body.appendChild(addp);

      sec.appendChild(body);
      momentsEl.appendChild(sec);
    });
    var addm=document.createElement('button'); addm.className='addphase'; addm.style.cssText='margin:16px 22px 0;display:block;width:calc(100% - 44px)'; addm.textContent='＋ 국면 추가';
    addm.addEventListener('click',function(){ var k='m'+Math.random().toString(36).slice(2,8); model.moments.push({key:k,cat:'ao',name:'새 국면',tag:'',phases:[{id:'p'+Math.random().toString(36).slice(2,8),name:'새 단계',principles:[''],snap:null}]}); model.open[k]=true; save(); render(); });
    momentsEl.appendChild(addm);
    var rst=document.createElement('button'); rst.className='addphase'; rst.style.cssText='margin:8px 22px 0;display:block;width:calc(100% - 44px);border-style:solid;opacity:.65'; rst.textContent='↺ 기본 템플릿으로 초기화';
    rst.addEventListener('click',function(){ if(!confirm('현재 내용을 지우고 기본 4국면 템플릿으로 되돌릴까요?'))return; var id=model.identity; model=seed(); model.identity=id; save(); render(); });
    momentsEl.appendChild(rst);
    // size all textareas after insert
    requestAnimationFrame(function(){
      [].forEach.call(document.querySelectorAll('.prow textarea'),autosize);
      autosize(identityEl);
    });
  }

  function phaseCard(m,ph){
    var card=document.createElement('div'); card.className='phase';

    // header: editable name + delete
    var head=document.createElement('div'); head.className='phead';
    var nm=document.createElement('input'); nm.className='pname'; nm.value=ph.name;
    nm.addEventListener('input',function(){ph.name=nm.value;save();});
    var pup=document.createElement('button'); pup.className='pdel'; pup.innerHTML='▲'; pup.title='위로';
    pup.addEventListener('click',function(){var i=m.phases.indexOf(ph);if(i>0){m.phases.splice(i,1);m.phases.splice(i-1,0,ph);save();render();}});
    var pdn=document.createElement('button'); pdn.className='pdel'; pdn.innerHTML='▼'; pdn.title='아래로';
    pdn.addEventListener('click',function(){var i=m.phases.indexOf(ph);if(i<m.phases.length-1){m.phases.splice(i,1);m.phases.splice(i+1,0,ph);save();render();}});
    var del=document.createElement('button'); del.className='pdel'; del.innerHTML='✕'; del.title='단계 삭제';
    del.addEventListener('click',function(){
      if(!confirm('이 단계를 삭제할까요?')) return;
      var i=m.phases.indexOf(ph); if(i>-1)m.phases.splice(i,1); save(); render();
    });
    head.appendChild(nm); head.appendChild(pup); head.appendChild(pdn); head.appendChild(del); card.appendChild(head);

    // principles
    var princ=document.createElement('div'); princ.className='princ';
    ph.principles.forEach(function(_,idx){ princ.appendChild(princRow(ph,idx)); });
    card.appendChild(princ);

    var addpr=document.createElement('button'); addpr.className='addprinc'; addpr.textContent='＋ 원칙 추가';
    addpr.addEventListener('click',function(){ ph.principles.push(''); save();
      princ.appendChild(princRow(ph,ph.principles.length-1));
      var tas=princ.querySelectorAll('textarea'); tas[tas.length-1].focus();
    });
    card.appendChild(addpr);

    // 트리거 (신호) 체크리스트 — 이 국면에서 행동을 작동시키는 신호 (예: 백패스·나쁜 첫터치·터치라인 가두기)
    ph.triggers = ph.triggers || [];
    var trgWrap=document.createElement('div'); trgWrap.style.cssText='margin-top:11px';
    var trgHd=document.createElement('div'); trgHd.textContent='트리거 (신호)'; trgHd.style.cssText='font-size:11px;font-weight:700;opacity:.5;letter-spacing:.02em;margin-bottom:6px';
    trgWrap.appendChild(trgHd);
    var trgList=document.createElement('div'); trgList.style.cssText='display:flex;flex-direction:column;gap:6px';
    function trgRow(i){
      var r=document.createElement('div'); r.style.cssText='display:flex;align-items:center;gap:8px';
      var c=document.createElement('input'); c.type='checkbox'; c.checked=!!ph.triggers[i].on; c.style.cssText='width:16px;height:16px;flex:0 0 auto;accent-color:#ee2222;cursor:pointer';
      c.addEventListener('change',function(){ ph.triggers[i].on=c.checked; save(); });
      var t=document.createElement('input'); t.type='text'; t.value=ph.triggers[i].text||''; t.placeholder='작동 신호를 적어요 (예: 상대 백패스)';
      t.style.cssText='flex:1;border:1px solid var(--line);border-radius:6px;padding:5px 9px;background:var(--surface);color:inherit;font-size:13px';
      t.addEventListener('input',function(){ ph.triggers[i].text=t.value; save(); });
      var x=document.createElement('button'); x.className='pdel'; x.innerHTML='✕'; x.title='트리거 삭제';
      x.addEventListener('click',function(){ ph.triggers.splice(i,1); save(); render(); });
      r.appendChild(c); r.appendChild(t); r.appendChild(x); return r;
    }
    ph.triggers.forEach(function(_,i){ trgList.appendChild(trgRow(i)); });
    trgWrap.appendChild(trgList);
    var addt=document.createElement('button'); addt.className='addprinc'; addt.textContent='＋ 트리거';
    addt.addEventListener('click',function(){ ph.triggers.push({text:'',on:false}); save(); trgList.appendChild(trgRow(ph.triggers.length-1)); });
    trgWrap.appendChild(addt);
    card.appendChild(trgWrap);

    // snapshot
    var snapwrap=document.createElement('div'); snapwrap.className='snapwrap';
    function paintSnap(){
      snapwrap.innerHTML='';
      if(ph.snap && ph.snap.thumb){
        var t=document.createElement('div'); t.className='snapthumb';
        t.innerHTML='<img src="'+ph.snap.thumb+'" alt="작전판"><button class="rm" title="첨부 제거">✕</button>';
        t.querySelector('.rm').addEventListener('click',function(){ ph.snap=null; save(); paintSnap(); });
        snapwrap.appendChild(t);
        if(ph.snap && ph.snap.snap){ var vb=document.createElement('button'); vb.className='attachbtn'; vb.innerHTML='▶ 보기'; vb.title='첨부한 작전판 열기'; vb.addEventListener('click',function(){ try{ parent.postMessage({source:'gamemodel',type:'openBoard',snap:ph.snap.snap,view:true},'*'); }catch(e){} }); snapwrap.appendChild(vb); }
      }
      var ab=document.createElement('button'); ab.className='attachbtn';
      ab.innerHTML=(ph.snap&&ph.snap.thumb)?'⟳ 작전판 다시 첨부':'＋ 작전판 첨부';
      ab.addEventListener('click',function(){ requestSnap(m,ph); });
      snapwrap.appendChild(ab);
    }
    paintSnap();
    ph._paintSnap=paintSnap;
    card.appendChild(snapwrap);

    return card;
  }

  function princRow(ph,idx){
    var row=document.createElement('div'); row.className='prow';
    var b=document.createElement('span'); b.className='b'; b.textContent='·';
    var ta=document.createElement('textarea'); ta.rows=1; ta.value=ph.principles[idx]||'';
    var PH_EX={'빌드업':'예) GK부터 3백으로 폭을 만들어 첫 압박선을 통과한다','전진 · 전개':'예) 하프스페이스의 8번을 경유해 측면을 전진한다','침투 · 마무리':'예) 윙어의 인→아웃 침투로 박스에 3명이 진입한다','전방 압박':'예) 상대 빌드업 시 9번이 CB 패스길을 끊으며 압박을 시작한다','미드 블록':'예) 4-4-2 블록으로 중앙을 닫고 측면으로 유도한다','로우 블록':'예) 박스 앞 공간을 닫고 크로스는 니어를 우선 차단한다','즉시 반응 (역압박)':'예) 상실 즉시 5초간 가장 가까운 3명이 역압박한다','후퇴 · 재정비':'예) 역압박 실패 시 블록 라인까지 후퇴해 재정비한다','빠른 역습':'예) 탈취 후 첫 패스는 전방, 3초 안에 전진한다','점유 안정화':'예) 역습이 닫히면 소유를 안정시키고 폭을 회복한다'};
    ta.setAttribute('placeholder', PH_EX[ph.name]||'이 국면에서 우리는…');
    ta.addEventListener('input',function(){ ph.principles[idx]=ta.value; autosize(ta); save(); });
    var x=document.createElement('button'); x.className='x'; x.innerHTML='✕';
    x.addEventListener('click',function(){
      ph.principles.splice(idx,1); if(ph.principles.length===0)ph.principles.push(''); save();
      // re-render this card's principle block
      var princ=row.parentNode; princ.innerHTML=''; ph.principles.forEach(function(_,i){princ.appendChild(princRow(ph,i));});
      requestAnimationFrame(function(){[].forEach.call(princ.querySelectorAll('textarea'),autosize);});
    });
    row.appendChild(b); row.appendChild(ta); row.appendChild(x);
    return row;
  }

  // ---- identity (collapsible, collapsed by default) ----
  var idcard=document.getElementById('idcard');
  var idHead=document.getElementById('idHead');
  var idPrev=document.getElementById('idPrev');
  identityEl.value=model.identity||'';
  model.idOpen=false;   // 진입 시 접힘
  function updateIdPrev(){
    var v=(model.identity||'').trim();
    idPrev.textContent = v ? v : '입력하기';
    idPrev.classList.toggle('placeholder', !v);
  }
  function applyIdOpen(){
    idcard.classList.toggle('open', model.idOpen!==false);
    if(model.idOpen) requestAnimationFrame(function(){ autosize(identityEl); });
  }
  updateIdPrev(); applyIdOpen();
  idHead.addEventListener('click',function(){ model.idOpen=!model.idOpen; applyIdOpen(); save(); });
  identityEl.addEventListener('input',function(){ model.identity=identityEl.value; autosize(identityEl); updateIdPrev(); save(); });

  // ---- snapshot bridge with the tactics board ----
  var pending=null; // {momentKey, phaseId}
  function requestSnap(m,ph){
    pending={momentKey:m.key,phaseId:ph.id};
    try{ parent.postMessage({source:'gamemodel',type:'openBoard',snap:(ph.snap&&ph.snap.snap)||null},'*'); }catch(e){}
  }
  window.addEventListener('message',function(e){
    var d=e.data||{};
    if(d.type==='boardResult' && pending){
      var m=model.moments.filter(function(x){return x.key===pending.momentKey;})[0];
      if(m){
        var ph=m.phases.filter(function(x){return x.id===pending.phaseId;})[0];
        if(ph){ ph.snap={thumb:d.thumb,snap:d.snap}; save(); if(ph._paintSnap)ph._paintSnap(); }
      }
      pending=null;
    } else if(d.type==='boardCancel'){ pending=null; }
  });

  // ---- document view / export ----
  var _bk=document.getElementById('btnBackTeam');if(_bk)_bk.addEventListener('click',function(){try{parent.postMessage({source:'gamemodel',type:'backToTeam'},'*');}catch(_){}});
  var _gmNav=document.getElementById('gmNav');if(_gmNav){[].forEach.call(_gmNav.querySelectorAll('button'),function(b){b.addEventListener('click',function(){var v=b.getAttribute('data-v');if(v==='gamemodel')return;try{parent.postMessage({source:'gamemodel',type:'openTeamView',view:v},'*');}catch(_){}});});}
  document.getElementById('btnDoc').addEventListener('click',function(){
    // make sure everything visible for print, then call print
    var prevOpen=JSON.parse(JSON.stringify(model.open));
    var prevIdOpen=model.idOpen;
    document.getElementById('prTitle').textContent='게임모델';
    [].forEach.call(document.querySelectorAll('.moment'),function(sec){ sec.classList.add('open'); });
    idcard.classList.add('open');
    [].forEach.call(document.querySelectorAll('textarea'),autosize);
    window.print();
    model.open=prevOpen; model.idOpen=prevIdOpen;
    render(); applyIdOpen();
  });

  render();
})();
</script>
</body>
</html>
