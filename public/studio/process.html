  const st=reviewStats();
  let wkbars=''; const dmax=Math.max(1,...st.perDay.map(x=>x.load));
  st.perDay.forEach(w=>{ const h=14+(w.load/dmax)*72; const bg=w.match?'#C0392B':bandColor(w.rpe);
    wkbars+=`<div class="c"><div class="v">${w.match?'경기':(w.load||'·')}</div><div class="bar" style="height:${h}px;background:${bg}"></div><div class="t">${w.d}</div></div>`; });
  const entries=Object.entries(st.dist).sort((a,b)=>b[1]-a[1]);
  const totalMin=entries.reduce((s,e)=>s+e[1],0)||1;
  const max=Math.max(1,...entries.map(e=>e[1]));
  let dist='';
  entries.forEach(r=>{ const col=distColorAx(r[0]); const pct=Math.round(r[1]/totalMin*100);
    dist+=`<div class="pdrow"><div class="k">${distName(r[0])}</div><div class="track"><div class="fill" style="width:${r[1]/max*100}%;background:${col}"></div></div><div class="v">${pct}%</div></div>`; });
  return `<div class="ponepage">`+pHeader(`${wkLabel()} 부하 리포트`)+
    `<div class="pstats"><div class="pstat"><b>${st.sessions}</b><span>세션</span></div><div class="pstat"><b>${st.avg||'—'}</b><span>평균 부하</span></div><div class="pstat"><b>${st.mins}</b><span>총 훈련(분)</span></div></div>`+
    `<h4 class="psec">요일별 부하 (강도×시간)</h4><div class="pwk">${wkbars}</div>`+
    `<h4 class="psec">훈련 배분 (분 기준)</h4><div class="pdist">${dist}</div>`+pFooter()+`</div>`;
}
/* 완성된 독립 인쇄 문서(HTML 문자열)를 만든다. 셸(부모)에서도 window.__buildPrintDoc(kind, blank)로 호출 가능.
   kind: 'week'|'weekboard'|'day'|'month'|'review'|'season'|'today' ('today'=오늘 날짜의 일간 폼, 'weekboard'=주간 보드 1장)
   blank: true면 펜 기입용 빈 양식(데이터 없이 골격만). week/day/month에만 적용,
          'today'는 blank일 때 날짜 무관 'day' 빈 양식으로 처리. review/season/weekboard는 데이터 폼이라 무시. */
function __buildPrintDoc(kind, blank){
  kind=kind||'week';
  if(blank && kind==='today') kind='day';           // 빈 양식은 오늘 날짜 스왑 불필요 (상태 미접근)
  if(kind==='review'||kind==='season'||kind==='weekboard') blank=false; // 리포트·보드엔 빈 양식 없음
  __pBlank=!!blank;
  let html, fname, cls=kind;
  try{
    if(kind==='today'){
      // 다른 주를 보고 있어도 '오늘'의 일간 폼을 생성: 임시 스왑 → 빌드 → 복원
      const sWk=wk, sWeek=week, sIdx=dayIdx;
      try{
        const n=offsetOfDate(new Date()), r=Math.floor(n/7), c=((n%7)+7)%7;
        weeksMap[r]=weeksMap[r]||blankWeek();
        wk=r; week=weeksMap[wk];
        recomputeMD();
        dayIdx=c;
        html=dayDocHTML();
      } finally {
        wk=sWk; week=sWeek; dayIdx=sIdx;
        recomputeMD();
      }
      fname='process_일간'; cls='day';
    }
    else if(kind==='review'){ html=reviewDocHTML(); fname='process_부하리포트'; }
    else if(kind==='season'){ html=seasonDocHTML(); fname='process_시즌'; }
    else if(kind==='day'){ html=dayDocHTML(); fname='process_일간'; }
    else if(kind==='month'){ html=monthDocHTML(); fname='process_월간'; }
    else if(kind==='weekboard'){ html=weekBoardDocHTML(); fname='process_주간보드'; }
    else { html=scheduleDocHTML(); fname='process_주간'; cls='week'; }
  } finally {
    __pBlank=false;   // 빌드가 어떤 경로로 끝나든 플래그 누수 방지
  }
  if(blank) fname+='_빈양식';
  // 이 문서의 모든 <style>을 그대로 합침 — #printDoc 외 규칙은 독립 문서에서 무해(매칭 안 됨)
  const allCss=Array.from(document.querySelectorAll('style')).map(s=>s.textContent).join('\n');
  const land=(kind!=='review');
  const pageWpx=land?1047:703;
  const baseWpx=(kind==='week')?760:(land?1047:703);
  // @page 여백 0 + body 패딩 대체 — 브라우저가 페이지 여백에 찍는 URL·날짜 머리글/바닥글 제거
  const pageCss=(land?'@page{size:A4 landscape;margin:0}':'@page{size:A4;margin:0}')
    +'html{margin:0;background:#fff}'
    // !important — ALL_CSS의 레거시 @media print{html,body{padding:0!important}}보다 뒤에 와서 이겨야 함
    +'body{margin:0!important;padding:'+(land?'10mm':'12mm')+'!important;background:#fff}'
    +'#printDoc{display:block!important;position:static;width:'+baseWpx+'px;margin:0 auto}'; // 인쇄 가용 폭과 동일(가로 297−20=277mm / 세로 210−24=186mm @96dpi)
  // 고정 1페이지 안전망: 높이를 잠시 풀어 자연 높이(need)를 정확히 잰 뒤, 넘치면 높이를 풀고 zoom으로 1장에 맞춤
  const zoomJs="window.addEventListener('load',function(){try{var p=document.querySelector('.ponepage');if(!p)return;var pd=document.getElementById('printDoc');var availH=p.clientHeight;p.style.height='auto';var needH=p.scrollHeight;var zw="+pageWpx+"/"+baseWpx+";var zh=availH/needH;var z=Math.min(zw,zh,1.6);p.style.height=needH+'px';if(z&&isFinite(z)&&Math.abs(z-1)>0.02){pd.style.zoom=(z*100).toFixed(1)+'%';}else{p.style.height='';}}catch(e){}});";
  return '<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>'+fname+'</title>'
    +'<style>'+allCss+'</style><style>'+pageCss+'</style></head>'
    +'<body><div id="printDoc" class="pl-'+cls+'">'+html+'</div>'
    +'<script>'+zoomJs+'<\/script></body></html>';
}

/* ---------- 출력 미리보기 모달 ---------- */
function __pvFit(){
  const ov=document.getElementById('pvOv'); if(!ov||ov.style.display==='none') return;
  const W=+ov.dataset.w||1100, H=+ov.dataset.h||780;
  const mob=window.innerWidth<600;
  const s=mob?(window.innerWidth*.94)/W:Math.min((window.innerWidth*.94)/W,(window.innerHeight*.80)/H,1);
  ov.querySelector('#pvSheet').style.transform='scale('+s+')';
  const wrap=ov.querySelector('#pvWrap');
  wrap.style.width=(W*s)+'px';
  if(mob){wrap.style.height=Math.min(H*s,window.innerHeight*.72)+'px';wrap.style.overflowY='auto';wrap.style.webkitOverflowScrolling='touch';}
  else{wrap.style.height=(H*s)+'px';wrap.style.overflowY='';}
  ov.querySelector('#pvBar').style.width=mob?'100%':Math.max(W*s,300)+'px';
  const mh=ov.querySelector('#pvMobHint'); if(mh)mh.style.display=mob?'block':'none';
}
function closePv(){ const ov=document.getElementById('pvOv'); if(ov) ov.style.display='none'; }
function exportPDF(kind){
  const doc=__buildPrintDoc(kind);
  const land=(kind!=='review');
  const W=land?1100:760, H=land?780:1080;                       // 미리보기 시트(iframe) 크기
  let ov=document.getElementById('pvOv');
  if(!ov){
    ov=document.createElement('div');
    ov.id='pvOv';
    ov.style.cssText='display:none;position:fixed;inset:0;z-index:9999;background:rgba(16,24,40,.55);flex-direction:column;align-items:center;justify-content:flex-start;overflow:auto;padding:20px 0 28px';
    ov.innerHTML=
      '<div id="pvBar" style="display:flex;align-items:center;gap:10px;margin:0 auto 12px;min-width:300px">'
      +'<b style="color:#fff;font-size:15px;font-weight:600;margin-right:auto;letter-spacing:-.01em">출력 미리보기</b>'
      +'<button id="pvPrint" style="background:#2563EB;color:#fff;border:0;border-radius:9px;padding:9px 16px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit">인쇄 / PDF 저장</button>'
      +'<button id="pvClose" style="background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:9px;padding:9px 14px;font-size:13px;font-weight:500;cursor:pointer;font-family:inherit">닫기</button>'
      +'</div>'
      +'<div id="pvMobHint" style="display:none;color:#FFD78A;font-size:11.5px;font-weight:600;max-width:94vw;text-align:center">폰에서는 위아래로 스크롤해 확인하세요 — 인쇄·PDF 저장은 PC·태블릿 브라우저에서 가장 안정적입니다</div>'
      +'<div id="pvWrap" style="margin:0 auto"><div id="pvSheet" style="background:#fff;border-radius:8px;box-shadow:0 18px 50px rgba(0,0,0,.35);overflow:hidden;transform-origin:top left"><iframe id="pvIfr" title="출력 미리보기" style="border:0;display:block;background:#fff"></iframe></div></div>';
    document.body.appendChild(ov);
    ov.addEventListener('mousedown',e=>{ if(e.target===ov) closePv(); });         // 배경 클릭 → 닫기
    ov.querySelector('#pvClose').onclick=closePv;
    ov.querySelector('#pvPrint').onclick=()=>{
      const f=document.getElementById('pvIfr');
      try{ f.contentWindow.focus(); f.contentWindow.print(); }catch(e){ console.error(e); }
    };
    document.addEventListener('keydown',e=>{ const o=document.getElementById('pvOv'); if(e.key==='Escape'&&o&&o.style.display!=='none') closePv(); });
    window.addEventListener('resize',__pvFit);
  }
  ov.dataset.w=W; ov.dataset.h=H;
  const ifr=ov.querySelector('#pvIfr');
  ifr.style.width=W+'px'; ifr.style.height=H+'px';
  ifr.srcdoc=doc;
  ov.style.display='flex';
  __pvFit();
}

// 훈련 추가/수정을 한 창에서: 시간 + 블록들(단계·주제·세부·형식)
let curSession = null;   // {di, ti, draft, openBi}
let draftSession = null; // 아직 확정 안 된 새 훈련 (완료 눌러야 추가)

function openSession(di, ti, bi){
  __sessAdvOpen=false;
  const day = week[di];
  if(ti===null || ti===undefined){            // 새 훈련 → 위저드 (단계별, 완료 눌러야 추가)
    const t=SLOTS[(day.trainings||[]).length]||'18:00';
    draftSession={time:t, players:'', aims:'', note:'', load:{rpe:5}, blocks:[{phase:'메인훈련', theme:'', fmt:'', dur:PHASE_DUR['메인훈련'], desc:''}]};
    curSession={di,draft:true,wizard:true,step:1,openBi:-1};   // 드릴은 접힌 채 시작
  } else {
    curSession={di,ti,draft:false,openBi:(bi==null?-1:bi)};  // 드릴 눌러 들어오면 그 블록 펼침
  }
  renderSession();
}
function wizStep(d){
  curSession.step = Math.max(1, Math.min(2, (curSession.step||1)+d));
  curSession.openBi=-1;
  renderSession();
}
function nextPhase(tr){
  for(const p of PHASES){ if(!tr.blocks.some(b=>b.phase===p)) return p; }
  return '보조훈련';   // 단계 다 찼으면 보조 반복 (같은 단계 여러 개 허용)
}
function blockCard(b, bi){
  const open = curSession.openBi === bi;
  const big  = bigOf(b.theme);
  const dotc = distColorAx(b.theme);
  const sub  = (b.theme && b.theme!==big) ? b.theme : '';
  const meta = [sub, b.fmt].filter(Boolean).join(' · ');
  const durTag = b.dur?`<span class="bdur">${b.dur}′</span>`:'';
  const chev = `<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>`;
  const summary = `<div class="bsum" onclick="toggleBlock(${bi})">
      <span class="bp"><b class="bnum">${circNum(bi)}</b> ${PHASE_SHORT[b.phase]||b.phase}</span>
      <span class="bt"><span class="cdot" style="background:${dotc}"></span>${big}${meta?` <em>· ${meta}</em>`:''}</span>
      ${durTag}${chev}
      <button class="brem" onclick="event.stopPropagation();sbRemove(${bi})">✕</button>
    </div>`;
  if(!open) return `<div class="bcard">${summary}</div>`;

  const phs=PHASES.map(p=>`<button class="pp ${b.phase===p?'on':''}" onclick="sbPhase(${bi},'${p}')">${PHASE_SHORT[p]||p}</button>`).join('');
  const bigChips=THEMES.map(t=>`<button class="fp ${big===t.n?'on':''}" onclick="sbBig(${bi},'${t.n}')"><span class="cdot" style="background:${t.c};margin-right:5px;vertical-align:middle"></span>${t.n}</button>`).join('');
  const subs=subsOf(big);
  const subChips = subs.length
    ? `<div class="subel">세부</div><div class="fmtpick">`+subs.map(sx=>`<button class="fp ${b.theme===sx?'on':''}" onclick="sbSub(${bi},'${sx}')">${sx}</button>`).join('')+`</div>`
    : '';
  const fmtChips=['없음',...FORMATS].map(f=>{
    const val=f==='없음'?'':f; const on=(val===''&&!b.fmt)||val===b.fmt;
    return `<button class="fp ${on?'on':''}" onclick="sbFmt(${bi},'${val}')">${f}</button>`;
  }).join('');
  const esc=s=>(s||'').replace(/"/g,'&quot;');
  const phaseCustom=PHASES.includes(b.phase)?'':esc(b.phase);
  const themeKnown=THEMES.some(t=>t.n===b.theme||t.subs.includes(b.theme));
  const themeCustom=themeKnown?'':esc(b.theme);
  const fmtCustom=(!b.fmt||FORMATS.includes(b.fmt))?'':esc(b.fmt);
  return `<div class="bcard open">${summary}
    <div class="bbody">
      <div class="subel">단계</div><div class="phasepick">${phs}</div>
      <input class="chipfree" type="text" value="${phaseCustom}" placeholder="직접 입력 (예: 전술미팅·컨디셔닝)" oninput="sbPhaseTxt(${bi},this.value)">
      <div class="subel">국면 <span style="color:var(--text-3);font-weight:300">(선택)</span></div>
      ${phaseControlHTML('B'+bi)}
      <div class="subel">형식 <span style="color:var(--text-3);font-weight:300">(선택)</span></div>
      <div class="fmtpick">${fmtChips}</div>
      <input class="chipfree" type="text" value="${fmtCustom}" placeholder="직접 입력" oninput="sbFmtTxt(${bi},this.value)">
      <div class="drow2">
        <div style="flex:0 0 92px"><div class="subel">시간(분)</div>
          <input class="stime durin" type="number" min="0" value="${b.dur||''}" oninput="sbDur(${bi},this.value)"></div>
        <div style="flex:1"><div class="subel">설명 <span style="color:var(--text-3);font-weight:300">(선택)</span></div>
          <input class="stime descin" type="text" value="${(b.desc||'').replace(/"/g,'&quot;')}" placeholder="무엇을·어떻게" oninput="sbDesc(${bi},this.value)"></div>
      </div>
      <div class="subel">작전판 <span style="color:var(--text-3);font-weight:300">(선택)</span></div>
      <div class="boardrow">${b.board&&b.board.thumb?`<div class="boardthumb">${b.board.thumb}</div>`:''}<button class="boardbtn" onclick="openBoardForBlock(${bi})">${b.board?'작전판 수정':'＋ 작전판에서 그리기'}</button>${b.board?`<button class="boardbtn rm" onclick="clearBoard(${bi})">제거</button>`:''}</div>
    </div>
  </div>`;
}
function toggleBlock(bi){
  curSession.openBi = (curSession.openBi===bi) ? -1 : bi;

}

  if(curSession.wizard){ renderWizard(); return; }

function renderWizard(){
  const day=week[curSession.di];
  const tr=curTr();
  const step=curSession.step||1;
  const sheet=document.getElementById('sheet');
  const titles={1:'국면 · 강도', 2:'드릴'};

  if(step===1){
    const noM=!week.some(d=>d.match)&&!wizMdSkip[wk];
    const mdBanner=noM?`<div class="wizmd"><span>이번 주 경기일을 정하면, 경기 기준(MD)으로 강도를 잡아드려요</span><div class="wizmd-days">${week.map((d,i)=>`<button type="button" onclick="wizSetMatch(${i})">${d.d}</button>`).join('')}<button type="button" class="skip" onclick="wizSkipMatch(this)">경기 없음</button></div></div>`:'';

    body=recHtml+`<div class="wizhint" style="margin-top:4px">블록을 눌러 자유롭게 구성하세요 — 모두 선택이며, 비워 둬도 됩니다</div>

  }
  const back = step>1
    ? `<button class="btn" onclick="wizStep(-1)">← 뒤로</button>`

    ? `<button class="btn" onclick="commitSession()">완료</button><button class="btn solid" onclick="wizStep(1)">다음 →</button>`
    : `<button class="btn solid" onclick="commitSession()">완료</button>`;
  sheet.innerHTML=`<button class="closex" onclick="cancelSession()">×</button>
    <div class="wizdots">${dots}</div>
    <h3>${day.d}요일 새 훈련 <span class="htot">· ${titles[step]}</span></h3>
    ${body}
    <div class="actionbar" style="padding:0;margin-top:14px">${back}${next}</div>`;
  document.getElementById('scrim').classList.add('show');

window.qAddBlock=function(ev,inp){
  if(ev.key!=='Enter')return;
  if(ev.isComposing||ev.keyCode===229)return;   // 한글 조합 중 Enter 무시
  ev.preventDefault();
  const nm=(inp.value||'').trim();if(!nm)return;
  const tr=curTr();if(!tr)return;
  const nb={phase:nextPhase(tr),theme:(tr.aims&&tr.aims!=='리커버리')?tr.aims:'',fmt:'',dur:15,desc:nm};
  tr.blocks=tr.blocks||[];tr.blocks.push(nb);
  renderSession();if(!curSession.draft){save();renderWeek();}
  setTimeout(()=>{const q=document.querySelector('.qadd');if(q){q.value='';q.focus();}},60);
};
function sbAdd(){
  const tr=curTr();
  const ph=nextPhase(tr);
  const defTheme=(tr.aims && tr.aims!=='리커버리')?tr.aims:'';
  const nb={phase:ph, theme:defTheme, fmt:'', dur:PHASE_DUR[ph]||15, desc:''};
  tr.blocks.push(nb);                          // 순서는 코치 마음 — 자동 정렬하지 않음
  curSession.openBi = tr.blocks.length-1;      // 새로 더한 블록 펼치기
  renderSession(); if(!curSession.draft) renderWeek();
}
function sbRemove(bi){

function commitSession(){
  // 빈 블록이어도 OK — 목표·메모만 있는 훈련도 유효. 완전히 빈 것만 정리.
  const hasContent=tr=>tr && (tr.blocks.length || tr.aims || tr.note || tr.players);
  if(curSession.draft){
    const day=week[curSession.di];
    if(hasContent(draftSession)){ day.trainings=day.trainings||[]; day.trainings.push(draftSession); day.rest=false; day.off=false; }
    draftSession=null;
  } else {
    const {di,ti}=curSession; const day=week[di], tr=day.trainings[ti];
    if(tr && !hasContent(tr)){ day.trainings.splice(ti,1); }
    if(day.trainings.length===0 && !day.match) day.rest=true;
  }
  curSession=null;
  document.getElementById('scrim').classList.remove('show');
  syncViews();
}
function cancelSession(){
  if(curSession.draft){
    draftSession=null;                       // 초안 폐기 — 아무것도 추가 안 됨
  } else {
    const {di,ti}=curSession; const day=week[di], tr=day.trainings[ti];
    if(tr && tr.blocks.length===0 && !(tr.aims||tr.note||tr.players)){ day.trainings.splice(ti,1); }
    if(day.trainings.length===0 && !day.match) day.rest=true;
  }
  curSession=null;
  document.getElementById('scrim').classList.remove('show');
  syncViews();
}

  const fset=AIMS2FOCUS[theme]||[];

  const inF=d=>{ if(!fset.length) return true;
    const wf=d.warmFor||WIZ_WARMFOR[d.name]||null;
    return fset.indexOf(d.focus)>=0 || (wf&&wf.some(f=>fset.indexOf(f)>=0)); };
  const warmDur=QP_R5(totalMin*0.2);
  const mainDur=QP_R5(totalMin*0.45);

  const warmBlk={phase:'웜업',theme:'',fmt:'',dur:warmDur,desc:''};
  const libWarm=lib.filter(d=>wizWarm(d)&&inF(d))[0];
  const _isGen=nm=>!nm||/^드릴\s*\d+$/.test(String(nm).trim());
  if(libWarm && !_isGen(libWarm.name)){ warmBlk.theme=libWarm.name; warmBlk.desc=libWarm.overview||''; }
  else if(false){
    const wname=Object.keys(WIZ_WARMFOR).find(n=>WIZ_WARMFOR[n].some(f=>fset.indexOf(f)>=0))||Object.keys(WIZ_WARMFOR)[0];
    warmBlk.theme=wname;
  }
  // ② 메인훈련 — 주제 포커스에 맞는 라이브러리 드릴 (위저드와 동일: theme=이름, desc=개요)
  const mainBlk={phase:'메인훈련',theme:theme+' 메인 드릴',fmt:'',dur:mainDur,desc:''};
  const libMain=lib.filter(d=>!wizWarm(d)&&inF(d)&&fset.indexOf(d.focus)>=0)[0]||lib.filter(d=>!wizWarm(d)&&inF(d))[0];
  const isGeneric=nm=>!nm||/^드릴\s*\d+$/.test(String(nm).trim());
  if(libMain && !isGeneric(libMain.name)){ mainBlk.theme=libMain.name; mainBlk.desc=libMain.overview||''; }
  else if(libMain && libMain.overview){ mainBlk.desc=libMain.overview; }

  const gameBlk = theme==='리커버리'
    ? {phase:'메인훈련',theme:'리커버리',fmt:'',dur:gameDur,desc:'가벼운 게임 · 회복 위주'}
    : {phase:'메인훈련',theme:theme,fmt:'경기',dur:gameDur,desc:theme+' 적용 게임'};
  const tr={time:SLOTS[(day.trainings||[]).length]||'18:00',players:'',aims:theme,note:'',
    load:{rpe:Math.max(1,Math.min(10,+rpe||6))},blocks:[warmBlk,mainBlk,gameBlk]};

}

     +".sched-hint li b{font-weight:800;color:#3a6df0;margin-right:3px;}"
     +".sched-hint .sh-dim{color:#5b7bb5;}"
     +".sched-hint .sh-x{position:absolute;top:7px;right:10px;cursor:pointer;font-size:19px;line-height:1;color:#8aa0c8;background:none;border:0;}"
     +".sched-hint .sh-x:hover{color:#1f3a6e;}";
    document.head.appendChild(s);
  }
  function build(){
    return true; /* 처음 안내 배너 제거 */
    if(document.getElementById("schedHint"))return true;
    try{ if(localStorage.getItem(KEY)) return true; }catch(e){}
    var tg=document.getElementById("vtoggle"); if(!tg)return false;
    var d=document.createElement("div"); d.id="schedHint"; d.className="sched-hint";
    d.innerHTML='<button class="sh-x" title="닫기">×</button>'
      +'<div class="sh-t">처음이신가요? 이렇게 시작하세요</div>'
      +'<ul>'
      +'<li><b>①</b>경기일을 정하면 그 주가 자동으로 짜여요 <span class="sh-dim">(위 ‘다음 경기’ 누르기)</span></li>'
      +'<li><b>②</b>날짜 칸을 눌러 훈련·미팅을 추가</li>'
      +'<li><b>③</b>아래 <b style="color:#1f3a6e">＋ 이번 주 훈련 설계하기</b>로 한 번에 만들기</li>'
      +'</ul>';
    tg.parentNode.insertBefore(d, tg.nextSibling);
    d.querySelector(".sh-x").addEventListener("click",function(){ d.remove(); try{localStorage.setItem(KEY,"1");}catch(e){} });
    return true;
  }
  function init(){ css(); var n=0; var t=setInterval(function(){ if(build()||(++n>20))clearInterval(t); },300); }
  if(document.readyState!=="loading") init(); else document.addEventListener("DOMContentLoaded",init);
})();


;(function(){
  function addCss(){ if(document.getElementById("wkIntCss"))return; var s=document.createElement("style");s.id="wkIntCss";
    s.textContent=".wk-int{background:rgba(201,146,80,.13) !important;}"
     +".wkbd-lab.wk-int{color:#a8631a !important;font-weight:800 !important;}"
     +".wk-trtop{box-shadow:inset 0 2px 0 rgba(58,109,240,.20) !important;}";
    document.head.appendChild(s); }
  function tag(){ try{
    var sc=document.querySelector(".wkbd-scroll"); if(!sc)return; var grid=sc.children[0]; if(!grid)return;
    [].forEach.call(grid.children,function(c){ var g=c.style.gridRow; if(!g)return; c.classList.remove("wk-int","wk-trtop"); if(g==="5")c.classList.add("wk-int"); if(g==="7")c.classList.add("wk-trtop"); });
  }catch(e){} }
  function wrap(){ if(window.__wkIntWrap)return; if(typeof renderWeekBoard!=="function"){setTimeout(wrap,300);return;} window.__wkIntWrap=1;
    var _o=renderWeekBoard; renderWeekBoard=function(){ var r=_o.apply(this,arguments); try{tag();}catch(e){} return r; }; }
  addCss(); wrap(); setTimeout(tag,1200); setTimeout(tag,2500);
})();

</script>
