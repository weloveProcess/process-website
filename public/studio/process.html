<!-- PROCESS — 주기화 (프로토타입 v1) -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css">
<style>
:focus-visible{outline:2px solid #3a6df0 !important;outline-offset:2px;border-radius:6px;}

  :root{
    --bg:#ECEDF0; --frame:#FFFFFF; --surface:#FFFFFF; --surface-2:#F1F2F4;
    --line:#E3E5E9; --line-soft:#ECEDF0;
    --text:#16181C; --text-2:#5C6068; --text-3:#767B85;
    --accent:#3a6df0; --accent-dim:#bcd0fb; --accent-soft:#edf2fe;
    --warm:#B5762B; --warm-soft:#FBF1E0; --warm-line:#E9CB97;
    --match:#C24A46; --match-soft:#FBEBEA; --match-line:#F0C2BF;
    --r:14px; --r-sm:9px;
    --f:'Pretendard',-apple-system,BlinkMacSystemFont,system-ui,'Apple SD Gothic Neo','Malgun Gothic','Segoe UI',Roboto,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{background:var(--bg);font-family:var(--f);color:var(--text);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;font-optical-sizing:auto;line-height:1.5}
  body{display:block;background:var(--bg);min-height:100dvh;padding:0}

  .phone{width:100%;max-width:100%;background:transparent;border:0;border-radius:0;
    overflow:hidden;position:relative;display:flex;flex-direction:column;height:100dvh;box-shadow:none}
  .stage{flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
  .stage::-webkit-scrollbar{display:none}
  .screen{display:none;flex-direction:column;min-height:100%;padding:0 0 32px}
  .screen.active{display:flex;animation:fade .4s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  /* wordmark device */
  .wm{font-weight:300;letter-spacing:.09em}
  .wm b{font-weight:800;letter-spacing:.03em}

  /* ---------- ENTRY ---------- */
  #entry{justify-content:flex-start;padding:76px 28px 38px}
  .brand{display:flex;flex-direction:column;align-items:center;gap:18px}
  .entryMain{flex:1;display:flex;flex-direction:column;justify-content:flex-start;align-items:center;width:100%;padding-top:52px}
  .brand .wm{font-size:31px}
  .brand small{color:var(--text-3);font-size:11px;letter-spacing:.24em;font-weight:300}

  .ask{text-align:center}
  .ask h1{font-weight:300;font-size:20px;letter-spacing:-.01em;color:var(--text-2)}
  .ask h1 b{font-weight:700;color:var(--text)}
  .asksub{text-align:center;max-width:300px;margin:14px auto 0;font-size:12.5px;line-height:1.55;color:var(--text-3);font-weight:300;word-break:keep-all}
  .stepper{display:flex;align-items:center;justify-content:center;gap:24px;margin:30px 0 2px}
  .step-btn{width:52px;height:52px;border-radius:50%;border:1px solid var(--line);background:var(--surface);
    color:var(--text-2);font-size:24px;font-weight:300;cursor:pointer;transition:.15s}
  .step-btn:active{background:var(--surface-2);transform:scale(.94)}
  .daynum{min-width:150px;text-align:center}
  .daynum .n{font-size:60px;font-weight:200;line-height:.9;letter-spacing:-.045em;font-variant-numeric:tabular-nums;font-feature-settings:"tnum";background:none;border:none;
    color:var(--text);font-family:var(--f);text-align:center;width:3.5ch;padding:0;outline:none;transition:width .12s;
    border-bottom:1px dashed var(--line)}
  .daynum .n:focus{border-bottom-color:var(--accent)}
  .daynum .n::-webkit-outer-spin-button,.daynum .n::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .daynum .u{font-size:12px;color:var(--text-3);margin-top:12px;letter-spacing:.12em}
  .chips{display:flex;justify-content:center;gap:7px;margin-top:30px;flex-wrap:wrap}
  .chip{font-size:12.5px;color:var(--text-2);background:var(--surface);border:1px solid var(--line);
    padding:7px 15px;border-radius:20px;cursor:pointer;transition:.15s}
  .chip.on{color:var(--accent);border-color:var(--accent-dim);background:var(--accent-soft)}

  .preview{margin-top:26px;border:1px solid var(--line-soft);border-radius:var(--r);padding:15px 16px 13px;background:var(--surface)}
  .preview .lbl{font-size:11px;color:var(--text-3);letter-spacing:.06em;margin-bottom:13px}
  .bars{display:flex;align-items:flex-end;gap:9px;height:62px}
  .bars .b{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px}
  .bars .bar{width:62%;border-radius:3px 3px 0 0;background:var(--accent-dim);transform-origin:bottom;
    animation:grow .6s cubic-bezier(.2,.8,.2,1) backwards}
  @keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
  .bars .bt{font-size:9.5px;color:var(--text-3)}

  .cta{width:100%;border:none;background:var(--text);color:#fff;font-family:var(--f);font-weight:700;
    font-size:16px;letter-spacing:-.01em;box-shadow:0 2px 10px rgba(20,30,50,.16);border-radius:var(--r);padding:16px;cursor:pointer;display:flex;align-items:center;
    justify-content:center;gap:8px;transition:.15s;margin-top:0}
  .cta:active{transform:scale(.985);opacity:.92}
  .cta svg{width:17px;height:17px}
  .foot{text-align:center;color:var(--text-3);font-size:11.5px;margin-top:16px;font-weight:300}

  /* ---------- TOP BAR ---------- */
  .top{position:sticky;top:0;z-index:5;background:linear-gradient(var(--frame) 72%,transparent);
    padding:22px 22px 12px;display:flex;align-items:center;justify-content:space-between}
  .top h2{font-size:23px;font-weight:300;letter-spacing:-.015em}
  .top h2 b{font-weight:800}
  .top .mini{font-size:11px;color:var(--text-3);letter-spacing:.2em;font-weight:300}
  .top .mini.tap{cursor:pointer;display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line-soft);
    border-radius:20px;padding:5px 11px;letter-spacing:.06em;background:var(--surface);transition:.15s}
  .top .mini.tap:active{background:var(--surface-2)}
  .top .mini .edpx{width:11px;height:11px;opacity:.6}
  .ddedit{display:flex;align-items:center;justify-content:center;gap:22px;margin-top:18px}
  .ddnum{min-width:120px;text-align:center}
  .ddnum .n{font-size:54px;font-weight:200;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums;font-feature-settings:"tnum";background:none;border:none;
    color:var(--text);font-family:var(--f);text-align:center;width:2.6ch;padding:0;outline:none;border-bottom:1px dashed var(--line)}
  .ddnum .n:focus{border-bottom-color:var(--accent)}
  .ddnum .n::-webkit-outer-spin-button,.ddnum .n::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .ddlabel{display:block;width:100%;box-sizing:border-box;margin-top:16px;border:1px solid var(--line);border-radius:11px;
    padding:13px 14px;font-size:15px;font-family:var(--f);color:var(--text);background:var(--surface);text-align:center}
  .ddlabel:focus{outline:none;border-color:var(--accent)}
  .ddlabel::placeholder{color:var(--text-3);font-weight:500}
  .ddnum .u{display:block;font-size:11px;color:var(--text-3);margin-top:8px;letter-spacing:.1em}

  .toggle{display:flex;background:var(--surface-2);border:1px solid var(--line-soft);border-radius:11px;
    padding:3px;margin:2px 22px 14px}
  .toggle div{flex:1;text-align:center;font-size:13px;color:var(--text-2);padding:8px 0;border-radius:8px;cursor:pointer;transition:.18s;font-weight:400}
  .toggle div.on{color:var(--text);background:#fff;font-weight:600;box-shadow:0 1px 3px rgba(20,30,50,.12)}

  .weeknav{display:flex;align-items:center;justify-content:space-between;padding:0 26px 14px}
  .weeknav span{font-size:14px;font-weight:500}
  .weeknav button{background:none;border:none;color:var(--text-3);cursor:pointer;padding:4px;display:flex}
  .weeknav svg{width:18px;height:18px}
  .autobar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 22px 14px;
    background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r-sm);padding:9px 12px}
  .autolbl{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--text-2);font-weight:500}
  .autolbl svg{width:14px;height:14px;color:var(--accent)}
  .autodays{display:flex;gap:5px}
  .autodays span{font-size:11.5px;color:var(--text-2);background:var(--surface-2);border:1px solid transparent;
    padding:5px 10px;border-radius:7px;cursor:pointer;transition:.15s}
  .autodays span.on{color:var(--accent);border-color:var(--accent-dim);background:var(--accent-soft)}

  /* ---------- WEEK ROWS ---------- */
  .rows{padding:0 18px;display:flex;flex-direction:column;gap:7px}
  .row{display:flex;gap:11px}
  .daycol{width:34px;flex-shrink:0;text-align:center;padding-top:11px;cursor:pointer}
  .daycol:active .mdbadge{color:var(--accent)}
  .daycol .dd{font-size:13.5px;font-weight:600}
  .daycol .dn{font-size:9.5px;color:var(--text-3);margin-top:1px}
  .daycol.sun .dd{color:var(--match)}
  .daycol .mdbadge{font-size:9px;color:var(--text-3);margin-top:5px;font-weight:600;letter-spacing:.01em}
  .daycol .mdbadge.mdmatch{color:var(--match)}
  .daycol .mdbadge.mdman{color:var(--accent)}
  .daycol .mdbadge.mdadd{color:var(--text-3);opacity:.45;font-weight:400}
  .dayhead{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:1px 2px 8px;cursor:pointer}
  .aims{font-size:12.5px;font-weight:700;color:var(--text);letter-spacing:-.01em;line-height:1.3}
  .aims.empty{color:var(--text-3);font-weight:400}
  .fitpill{font-size:9.5px;font-weight:700;padding:2px 8px;border-radius:6px;flex-shrink:0;border:1px solid currentColor;letter-spacing:.02em}
  .metainput{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:11px 13px;color:var(--text);font-family:var(--f);font-size:14px;margin-bottom:18px;outline:none}
  .metainput:focus{border-color:var(--accent-dim)}
  .metainput::placeholder{color:var(--text-3)}
  .subel{font-size:11px;color:var(--text-3);margin:4px 0 7px;font-weight:500}
  /* 세부 설정 토글 + 큰 메모 + 강조 시간 (세션 편집창) */
  .memobig{min-height:108px;resize:vertical;line-height:1.5}
  .srow-prime{margin:6px 0 18px}
  .stime-prime{font-size:18px;padding:13px 14px;font-weight:600}
  .advtoggle{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:46px;
    background:var(--surface-2);border:1px solid var(--line);border-radius:10px;color:var(--text-2);
    font-family:var(--f);font-size:13px;font-weight:500;padding:0 14px;margin:2px 0 14px;cursor:pointer}
  .advtoggle:active{background:var(--surface)}
  .advtoggle .advcar{color:var(--text-3);font-size:12px}
  .advbody{margin-bottom:4px}
  /* 자동구성 바 초기화 버튼 */
  .resetbtn{width:30px;height:30px;flex-shrink:0;display:grid;place-items:center;border:1px solid var(--line-soft);
    background:var(--surface-2);color:var(--text-2);border-radius:8px;cursor:pointer;margin-left:8px}
  .resetbtn svg{width:15px;height:15px}
  .resetbtn:active{background:var(--warm-soft);color:var(--warm)}
  /* 빈 블록 안내 */
  .emptyblk{font-size:11.5px;color:var(--text-3);text-align:center}
  /* 통합 훈련 편집창 */
  .srow{display:flex;align-items:center;gap:12px;margin:4px 0 16px}
  .wizdots{display:flex;gap:7px;justify-content:center;margin:2px 0 10px}
  .wizdots .wdot{width:7px;height:7px;border-radius:50%;background:var(--line);transition:.2s}
  .wizdots .wdot.on{background:var(--accent);width:22px;border-radius:4px}
  .wizdots .wdot.done{background:var(--accent-dim)}
  .wizhint{font-size:12px;color:var(--text-3);text-align:center;margin:14px 0 4px}
  .moretoggle{display:flex;align-items:center;gap:5px;width:100%;justify-content:center;background:none;border:none;
    color:var(--text-3);font-family:var(--f);font-size:12px;font-weight:400;cursor:pointer;padding:10px 0 4px;margin-top:4px}
  .moretoggle i{color:var(--accent);font-style:normal;font-weight:500}
  .moretoggle svg{width:13px;height:13px;transition:transform .15s}
  .moretoggle svg.up{transform:rotate(180deg)}
  .stime{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:9px 12px;
    color:var(--text);font-family:var(--f);font-size:14px;outline:none}
  .stime:focus{border-color:var(--accent-dim)}
  .bcards{display:flex;flex-direction:column;gap:10px}
  .bcard{background:var(--surface);border:1px solid var(--line-soft);border-radius:12px;padding:0;overflow:hidden}
  .bcard.open{border-color:var(--accent-dim);background:var(--accent-soft)}
  .bsum{display:flex;align-items:center;gap:9px;padding:12px 12px;cursor:pointer}
  .bsum .bp{font-size:11px;color:var(--text-3);font-weight:600;width:62px;flex-shrink:0;display:flex;align-items:center;gap:4px}
  .bsum .bt{flex:1;font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:7px;min-width:0}
  .bsum .bt em{color:var(--text-3);font-weight:400;font-size:12px;font-style:normal;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bsum .chev{width:15px;height:15px;color:var(--text-3);flex-shrink:0;transition:transform .2s}
  .bcard.open .chev{transform:rotate(180deg);color:var(--accent)}
  .bbody{padding:2px 12px 8px;border-top:1px solid var(--line-soft);margin-top:-1px}
  .bchead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
  .bchead .phasepick{margin:0}
  .brem{width:24px;height:24px;flex-shrink:0;border:none;background:transparent;color:var(--text-3);
    font-size:15px;cursor:pointer;border-radius:6px}
  .brem:active{background:var(--match-soft);color:var(--match)}
  .savebtn{width:100%;padding:13px;border:none;border-radius:11px;background:var(--accent);color:#fff;
    font-family:var(--f);font-size:14.5px;font-weight:700;cursor:pointer}
  .cells{flex:1;display:flex;flex-direction:column;gap:6px}
  .sess{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r-sm);
    padding:11px 13px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;transition:.15s}
  .sess:active{background:var(--surface-2)}
  .sess .t{font-size:13.5px;font-weight:400;display:flex;align-items:center;gap:7px}
  .sess .t small{color:var(--text-3);font-weight:300;margin-left:1px;font-size:12px}
  .load{font-size:11px;color:var(--text-2);background:var(--surface-2);padding:3px 9px;border-radius:6px;font-variant-numeric:tabular-nums}
  .sess.hard{border-color:var(--warm-line)}
  .sess.hard .load{color:var(--warm);background:var(--warm-soft)}
  .matchcell{background:var(--match-soft);border:1px solid var(--match-line);border-radius:var(--r-sm);
    padding:11px 13px;display:flex;align-items:center;justify-content:space-between}
  .matchcell .t{font-size:13.5px;font-weight:600;color:var(--match);display:flex;align-items:center;gap:7px}
  .matchcell .t svg{width:14px;height:14px}
  .matchcell .o{font-size:11.5px;color:var(--match)}
  .rest{border:1px dashed var(--line);border-radius:var(--r-sm);padding:11px 13px;color:var(--text-3);font-size:12.5px;font-weight:300}
  .add{border:none;background:none;color:var(--text-3);font-size:12px;display:flex;align-items:center;gap:5px;
    padding:7px 2px 2px;cursor:pointer;font-family:var(--f)}
  .add svg{width:13px;height:13px}
  .add:active{color:var(--accent)}
  .addrow{display:flex;gap:8px;margin-top:2px}
  .addpill{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;font-size:12.5px;
    font-weight:500;color:var(--text-2);background:transparent;border:1px dashed var(--line);
    border-radius:var(--r-sm);padding:10px 8px;cursor:pointer;transition:.15s}
  .addpill svg{width:14px;height:14px}
  .addpill:active{background:var(--surface-2);border-style:solid}
  .addpill.match{color:var(--match);border-color:var(--match-line)}
  .addpill.match:active{background:var(--match-soft);border-style:solid}
  .addpill.off{color:var(--text-3)}
  .restoff{border:1px dashed var(--line);border-radius:var(--r-sm);padding:12px 13px;color:var(--text-3);font-size:12.5px;font-weight:600;text-align:center;cursor:pointer;margin-top:2px}
  .restoff:active{background:var(--surface-2);border-style:solid}
  .wkx{flex:0 0 auto;width:28px;height:28px;margin:-4px -6px -4px -2px;border:none;background:none;color:var(--text-3);
    font-size:16px;font-weight:400;line-height:1;cursor:pointer;border-radius:8px;font-family:var(--f);
    display:flex;align-items:center;justify-content:center;padding:0}
  .wkx:active{background:var(--surface-2);color:#C0392B}
  .matchcell .o{margin-left:auto}
  .matchcell .wkx{color:var(--match);opacity:.7;margin-left:4px}
  .meetcell{display:flex;align-items:center;gap:8px;border:1px solid #F0DDB8;background:#FBF1E0;border-radius:var(--r-sm);
    padding:9px 12px;font-size:12.5px;font-weight:600;color:#8A6210;cursor:pointer;margin-top:2px}
  .meetcell .mtx{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .meetcell:active{background:#F6E8C8}
  /* 날짜 허브 모달 — ＋ 하나로 그 날 전부 */
  .hub-list{display:flex;flex-direction:column;gap:8px;margin:4px 0 14px}
  .hub-item{display:flex;align-items:center;gap:6px;background:var(--surface-2);border:1px solid var(--line);
    border-radius:11px;padding:10px 8px 10px 12px;font-size:12.5px;color:var(--text-2)}
  .hub-item .ht{flex:1;min-width:0;display:flex;align-items:center;gap:7px;font-weight:600;cursor:pointer}
  .hub-item .ht .sub{font-weight:400;color:var(--text-3)}
  .hub-item.match{background:var(--match-soft);border-color:var(--match-line)}
  .hub-item.meet{background:#FBF1E0;border-color:#F0DDB8}
  .hub-item.meet input{flex:1;min-width:0;border:none;background:none;font-family:var(--f);font-size:12.5px;
    font-weight:600;color:#6B4D0E;outline:none;padding:2px 0}
  .hub-x{flex:0 0 auto;border:none;background:none;color:var(--text-3);font-size:12px;font-weight:600;
    cursor:pointer;padding:6px 8px;border-radius:8px;font-family:var(--f)}
  .hub-x:active{background:var(--surface);color:#C0392B}
  .hub-empty{font-size:12.5px;color:var(--text-3);text-align:center;padding:14px 0;border:1px dashed var(--line);
    border-radius:11px;margin:4px 0 14px}
  .hub-add{margin:2px 0 6px}
  .hub-add input{width:100%;box-sizing:border-box;border:1.5px solid var(--accent-dim);border-radius:11px;padding:12px;font-family:var(--f);font-size:13px;font-weight:600;color:var(--text-2);background:var(--surface);outline:none}
  .hub-add input:focus{border-color:var(--accent)}
  .hub-item input{flex:1;min-width:0;border:none;background:none;font-family:var(--f);font-size:12.5px;font-weight:600;color:var(--text-2);outline:none;padding:2px 0}
  .hub-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .hub-grid button{min-height:48px;display:flex;align-items:center;justify-content:center;gap:7px;font-size:13px;
    font-weight:600;color:var(--text-2);background:var(--surface);border:1px solid var(--line);border-radius:12px;
    cursor:pointer;font-family:var(--f);padding:10px 8px}
  .hub-grid button:active{background:var(--surface-2)}
  .hub-grid button.hb-tr{color:var(--accent);border-color:var(--accent-dim)}
  .hub-grid button.hb-match{color:var(--match);border-color:var(--match-line)}

  .cdot{width:7px;height:7px;border-radius:2px;display:inline-block;flex-shrink:0}
  .mixcard{margin:16px 18px 0;background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r);padding:15px 16px}
  .mixcard .lbl{font-size:12px;color:var(--text-2);font-weight:500;margin-bottom:13px;display:flex;justify-content:space-between;align-items:center}
  .mixcard .lbl em{color:var(--text-3);font-weight:300;font-size:10.5px;font-style:normal;letter-spacing:.04em}
  .stack{display:flex;height:13px;border-radius:7px;overflow:hidden;gap:2px;background:var(--surface-2)}
  .seg{transition:width .45s cubic-bezier(.2,.8,.2,1)}
  .legend{display:flex;flex-wrap:wrap;gap:9px 15px;margin-top:14px}
  .lg{font-size:12px;color:var(--text-2);display:flex;align-items:center;gap:6px;font-weight:300}
  .lg b{font-weight:600;color:var(--text);font-variant-numeric:tabular-nums}
  .mempty{font-size:12px;color:var(--text-3);font-weight:300}

  .train{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r);padding:10px 12px 8px;margin-bottom:6px}

  .thead{display:flex;align-items:center;gap:8px;padding:2px 3px;cursor:pointer}

  .tlabel{font-size:12.5px;font-weight:700;letter-spacing:.01em;flex-shrink:0}
  .ttopic{flex:1;min-width:0;font-size:13px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ttopic.empty{color:var(--text-3);font-weight:400}
  .thead .chev{width:15px;height:15px;color:var(--text-3);flex-shrink:0;transition:transform .2s}
  .train.open .thead .chev{transform:rotate(180deg);color:var(--accent)}
  .editbtn{margin:8px 0 2px;border:1px solid var(--line);background:var(--surface-2);color:var(--text-2);
    font-family:var(--f);font-size:12px;font-weight:500;border-radius:8px;padding:8px 0;width:100%;
    display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer}
  .editbtn:active{background:var(--accent-soft);color:var(--accent);border-color:var(--accent-dim)}
  .editbtn svg{width:13px;height:13px}
  .ttopic .cdot{width:8px;height:8px;border-radius:2px;display:inline-block;margin-right:5px;vertical-align:middle}
  .snote{font-size:11.5px;color:var(--text-2);font-style:italic;margin:2px 2px 8px;line-height:1.4}
  .block .btype{align-items:flex-start}
  .bdesc{font-size:10.5px;color:var(--text-3);font-weight:400;margin-top:2px;line-height:1.35;white-space:normal}
  .bld{font-size:10.5px;color:var(--text-3);font-variant-numeric:tabular-nums;flex-shrink:0;margin-left:6px}
  .bdur{font-size:10px;color:var(--text-3);font-variant-numeric:tabular-nums;flex-shrink:0}
  .drow2{display:flex;gap:12px;margin-top:6px}
  .durin{width:100%}.descin{width:100%}
  .htot{font-size:12px;font-weight:300;color:var(--text-3)}
  .htot b{font-weight:600;color:var(--accent)}
  .phbanner{margin:0 22px 12px;display:flex;align-items:center;gap:10px;background:var(--accent-soft);
    border:1px solid var(--accent-dim);border-radius:var(--r-sm);padding:9px 13px;font-size:12px}
  .phbanner b{color:var(--accent);font-weight:700}
  .phbanner .pp2{color:var(--text-2)}
  .phbanner .dd2{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--text-3);font-size:11px}
  .ttime{font-size:11.5px;color:var(--text-3);font-variant-numeric:tabular-nums}
  .seshr{display:flex;align-items:center;gap:10px;margin:18px 0 12px;color:var(--text-3);font-size:11px;font-weight:600;letter-spacing:.04em}
  .seshr:before,.seshr:after{content:"";flex:1;height:1px;background:var(--line)}
  .blocks{display:flex;flex-direction:column;gap:5px}
  .block{display:flex;align-items:center;gap:9px;background:var(--surface-2);border:1px solid var(--line-soft);
    border-radius:8px;padding:9px 11px;cursor:pointer;transition:.15s}
  .block:active{background:var(--surface-2)}
  .block .bphase{font-size:11px;color:var(--text-3);width:62px;flex-shrink:0;font-weight:500;display:flex;align-items:center;gap:4px}
  .bnum{color:var(--accent);font-weight:700;font-size:13px;font-style:normal}
  .block .btype{flex:1;font-size:13px;display:flex;align-items:center;gap:7px}
  .block.hard{border-color:var(--warm-line)}
  .block.hard .load{color:var(--warm);background:var(--warm-soft)}
  .addblk{padding:7px 2px 1px}
  .phasepick{display:flex;gap:6px;margin-bottom:15px}
  .pp{flex:1;border:1px solid var(--line);background:var(--surface);color:var(--text-2);border-radius:8px;
    padding:10px 0;font-size:12.5px;font-family:var(--f);cursor:pointer;transition:.15s}
  .pp.on{color:var(--accent);border-color:var(--accent-dim);background:var(--accent-soft)}
  .fmt{font-size:10px;color:var(--text-3);border:1px solid var(--line);border-radius:5px;padding:1px 6px;font-weight:400;margin-left:1px}
  .fmtpick{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0 14px}
  .pksub{font-size:11px;font-weight:800;color:var(--text-3);letter-spacing:.02em;margin:2px 0 7px}
  .freerow{display:flex;gap:6px;margin:0 0 12px}
  .freerow input{flex:1;min-width:0;padding:9px 11px;border:1px solid var(--line);border-radius:9px;font-size:13px;font-family:var(--f);background:var(--surface);color:var(--text);outline:none}
  .freerow input:focus{border-color:var(--accent)}
  .freeadd{flex:0 0 auto;width:auto;padding:0 16px;border:none;border-radius:9px;background:var(--accent);color:#fff;font-weight:700;font-size:13px;font-family:var(--f);cursor:pointer}
  .chipfree{margin:2px 0 18px;width:100%;font-family:var(--f);font-size:12.5px;padding:8px 11px;border:1px dashed var(--line);border-radius:var(--r-sm);background:var(--surface);color:var(--text);outline:none;box-sizing:border-box}
  .chipfree:focus{border-color:var(--accent);border-style:solid}
  .chipfree::placeholder{color:var(--text-3)}
  .bbody .chipfree{margin:2px 0 10px}
  .rpewrap{display:flex;align-items:center;gap:12px;margin:2px 0 18px}
  .rpeslider{flex:1 1 auto;height:6px;border-radius:3px;-webkit-appearance:none;appearance:none;background:linear-gradient(90deg,rgb(88,132,194) 0%,rgb(170,174,180) 44%,rgb(217,72,59) 100%);outline:none}
  .rpeslider::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:#fff;border:2px solid var(--text);cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.2)}
  .rpeslider::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:#fff;border:2px solid var(--text);cursor:pointer}
  .rpebadge2{display:inline-flex;align-items:center;justify-content:center;min-width:30px;height:28px;padding:0 9px;border-radius:8px;font-size:14px;font-weight:800;color:#fff}
  .rrec{font-size:11px;color:var(--text-3);font-weight:500;white-space:nowrap}
  .fp{border:1px solid var(--line);background:var(--surface);color:var(--text-2);border-radius:7px;padding:8px 13px;font-size:12.5px;font-family:var(--f);cursor:pointer;transition:.15s}
  .fp .fp-x{margin-left:8px;color:var(--text-3);font-weight:800;opacity:.55;padding:0 3px;border-radius:5px}
  .fp .fp-x:hover{opacity:1;color:#E85F52}
  .fp.on{color:var(--accent);border-color:var(--accent-dim);background:var(--accent-soft)}
  .fp.mdmatchopt{color:var(--match);border-color:var(--match-line)}
  .fp.mdmatchopt:active{background:var(--match-soft)}
  .bbody .subel{margin:10px 0 6px}
  .bbody .phasepick{margin-bottom:10px}
  .bbody .fmtpick{margin:2px 0 4px}
  .bcard.open .fp{background:var(--surface)}
  .bcard.open .fp.on{background:#fff}
  .bcard.open .pp{background:var(--surface)}
  .bcard.open .pp.on{background:#fff}

  .actionbar{display:flex;gap:8px;padding:18px 22px 4px}
  .btn{flex:1;border:1px solid var(--line);background:var(--surface);color:var(--text);font-family:var(--f);
    font-size:13.5px;font-weight:500;border-radius:var(--r-sm);padding:12px;cursor:pointer;display:flex;
    align-items:center;justify-content:center;gap:7px;transition:.15s}
  .btn:active{background:var(--surface-2)}
  .btn.solid{background:var(--text);color:#fff;border-color:var(--text);font-weight:700}
  .btn svg{width:15px;height:15px}

  /* month / day simple views */
  .mview{padding:4px 22px;display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
  .mview .h{font-size:10px;color:var(--text-3);text-align:center;padding-bottom:4px;font-weight:600}
  .mcell{min-height:58px;border:1px solid var(--line-soft);border-radius:9px;background:var(--surface);
    display:flex;flex-direction:column;align-items:stretch;padding:5px 5px 6px;position:relative;overflow:hidden;
    cursor:pointer;transition:border-color .12s,background .12s,box-shadow .12s}
  .mcell:hover{border-color:var(--accent);box-shadow:0 2px 9px rgba(0,0,0,.07)}
  .mcell .mhdr{display:flex;flex-direction:column;align-items:flex-start;gap:1px;line-height:1.05;flex:0 0 auto}
  .mcell .mdate{font-size:9px;color:var(--text-3);font-weight:700;letter-spacing:.02em}
  .mcell .mmd{font-size:8px;color:var(--text-3);font-weight:800;letter-spacing:.01em;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
  .mcell .mtxt{flex:1;display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--text);font-weight:600;text-align:center;line-height:1.15;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
  .mcell.has{border-top:3px solid var(--tc,var(--line))}
  .mcell.m{border-color:var(--match-line);background:var(--match-soft);border-top:3px solid var(--match)}
  .mcell.m .mmd{color:var(--match)}
  .mcell.m .mtxt{color:var(--match);font-weight:800}
  .mcell.off .mtxt{color:var(--text-3);font-weight:700;font-size:9px;letter-spacing:.08em}
  .mcell .mmeet{font-size:9px;color:#B47A0E;line-height:1.1;text-align:center}
  .mweekhdr{grid-column:1/-1;font-size:11px;color:var(--text-2);font-weight:600;padding:11px 2px 2px;display:flex;justify-content:space-between;align-items:baseline}
  .mweekhdr.cur{color:var(--accent)}
  .mweekhdr .mwrange{font-size:9.5px;color:var(--text-3);font-weight:500}
  .tpldel{margin-left:7px;color:var(--text-3);font-size:10px;font-weight:700}
  .tpldel:hover{color:var(--warm)}
  .dview{padding:6px 22px;display:flex;flex-direction:column;gap:9px}
  .dbig{font-size:13px;color:var(--text-3);margin:2px 0 6px}

  /* ---------- REVIEW ---------- */
  .stats{display:flex;gap:8px;padding:2px 22px 0}
  .stat{flex:1;background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r-sm);padding:13px 8px;text-align:center}
  .stat .v{font-size:25px;font-weight:200;letter-spacing:-.02em}
  .stat .k{font-size:10.5px;color:var(--text-3);margin-top:3px}
  .card{margin:14px 22px 0;background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r);padding:15px 16px}
  .card .lbl{font-size:12px;color:var(--text-2);font-weight:500;margin-bottom:15px}
  .card .sublbl{color:var(--text-3);font-weight:300;font-size:11px;margin-left:6px}
  .lbars{display:flex;align-items:flex-end;gap:11px;height:96px;padding-top:4px}
  .lbars .c{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px}
  .lbars .vv{font-size:11px;color:var(--text-3);font-variant-numeric:tabular-nums}
  .lbars .lb{width:64%;border-radius:3px 3px 0 0;transform-origin:bottom;animation:grow .7s cubic-bezier(.2,.8,.2,1) backwards}
  .lbars .lt{font-size:9.5px;color:var(--text-3)}
  .dist{display:flex;flex-direction:column;gap:11px}
  .drow{display:flex;align-items:center;gap:11px}
  .drow .dk{font-size:12.5px;width:54px;flex-shrink:0}
  .drow .track{flex:1;height:7px;background:var(--surface-2);border-radius:4px;overflow:hidden}
  .drow .fill{height:100%;background:var(--text-3);border-radius:4px;transform-origin:left;animation:wide .8s cubic-bezier(.2,.8,.2,1) backwards}
  .drow .dv{font-size:11px;color:var(--text-3);width:30px;text-align:right;font-variant-numeric:tabular-nums}
  .drow.flag .dk{color:var(--warm)}
  .drow.flag .fill{background:var(--warm)}
  .drow.flag .dv{color:var(--warm)}
  @keyframes wide{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  .obs{margin:12px 22px 0;display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:var(--r-sm);padding:12px 14px}
  .obs svg{width:16px;height:16px;color:var(--text-3);flex-shrink:0}
  .obs p{font-size:12px;color:var(--text-2);line-height:1.5;font-weight:300}

  /* ---------- BOTTOM NAV ---------- */
  .nav{position:absolute;bottom:0;left:0;right:0;height:72px;background:rgba(255,255,255,.92);
    backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;padding:0 10px}
  .nav div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;color:var(--text-3);transition:.15s}
  .nav div.on{color:var(--text)}
  .nav svg{width:21px;height:21px}
  .nav span{font-size:10px;font-weight:300}

  /* ---------- MODAL ---------- */
  .scrim{position:absolute;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(3px);z-index:20;
    display:none;align-items:flex-end;animation:fade .25s}
  .scrim.show{display:flex}
  .sheet{width:100%;background:var(--frame);border-top:1px solid var(--line);border-radius:22px 22px 0 0;
    padding:20px 22px 26px;animation:up .3s cubic-bezier(.2,.8,.2,1);
    max-height:86vh;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
  .scrim{overscroll-behavior:contain}
  @keyframes up{from{transform:translateY(100%)}to{transform:none}}
  .sheet h3{font-size:16px;font-weight:600;margin-bottom:3px}
  .sheet .sub{font-size:12px;color:var(--text-3);margin-bottom:16px;font-weight:300}
  .typegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .tg{border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:var(--r-sm);
    padding:13px 0;font-size:13px;font-family:var(--f);cursor:pointer;transition:.15s;font-weight:400}
  .tg:active{background:var(--surface-2);border-color:var(--accent-dim)}
  .editrow{display:flex;align-items:center;justify-content:space-between;margin:6px 0 18px}
  .editrow .el{font-size:13px;color:var(--text-2)}
  .lstep{display:flex;align-items:center;gap:16px}
  .lstep button{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--text-2);font-size:20px;cursor:pointer}
  .lstep .lv{font-size:22px;font-weight:300;width:30px;text-align:center;font-variant-numeric:tabular-nums}
  .del{width:100%;border:1px solid var(--match-line);background:var(--match-soft);color:var(--match);
    font-family:var(--f);font-size:14px;font-weight:500;border-radius:var(--r-sm);padding:13px;cursor:pointer}
  .closex{position:absolute;top:16px;right:18px;color:var(--text-3);background:none;border:none;font-size:22px;cursor:pointer;font-weight:300}

  /* ---------- PRINT / PDF (흰 바탕 문서) ---------- */
  #printDoc{display:none}
  #printDoc.exporting{display:block;position:fixed;top:0;left:0;width:760px;max-width:100%;background:#fff;padding:30px;z-index:99999}
  @media print{
    @page{margin:13mm}
    html,body{background:#fff!important;padding:0!important;margin:0!important;display:block!important}
    .phone{display:none!important}
    #printDoc{display:block!important}
    *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
  }
  #printDoc{color:#14171A;font-family:var(--f);font-size:12px;line-height:1.5}
  #printDoc .phd{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid #14171A;padding-bottom:11px;margin-bottom:18px}
  #printDoc .pwm{font-size:25px;font-weight:300;letter-spacing:.05em}
  #printDoc .pwm b{font-weight:800;letter-spacing:.01em}
  #printDoc .pmeta{text-align:right;font-size:11px;color:#6B727A}
  #printDoc .pmeta strong{display:block;font-size:16px;color:#14171A;font-weight:700;letter-spacing:-.01em}
  #printDoc .pday{display:flex;gap:15px;padding:10px 8px;border-bottom:1px solid #ECEEF1;break-inside:avoid}
  #printDoc .pday-m{background:#FBECEC;border-radius:6px;border-bottom-color:transparent}
  #printDoc .pdaycol{width:38px;flex-shrink:0;font-weight:700;font-size:14px}
  #printDoc .pdaycol small{display:block;font-weight:400;color:#A2A8AE;font-size:10px;margin-top:1px}
  #printDoc .pmd{font-weight:600 !important;color:#6B727A !important;font-size:9px !important;margin-top:3px !important;letter-spacing:.02em}
  #printDoc .paims{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
  #printDoc .paims b{font-size:12.5px;font-weight:700;color:#14171A}
  #printDoc .pfit{font-size:9px;font-weight:700;padding:2px 7px;border-radius:5px;border:1px solid;flex-shrink:0;letter-spacing:.02em}
  #printDoc .pdaybody{flex:1;display:flex;flex-direction:column;gap:9px}
  #printDoc .pthd{font-size:11px;font-weight:700;color:#14171A;margin-bottom:5px}
  #printDoc .pslot{display:inline-block;font-size:9px;font-weight:800;color:#2954c8;border:1px solid #2954c8;border-radius:3px;padding:0 4px;margin-right:2px}
  #printDoc .pblk{display:flex;align-items:center;gap:9px;font-size:11.5px;padding:1px 0}
  #printDoc .pph{width:52px;flex-shrink:0;color:#838A91;font-size:10.5px}
  #printDoc .pdot{width:8px;height:8px;border-radius:2px;flex-shrink:0}
  #printDoc .pth{flex:1}
  #printDoc .pth em{color:#838A91;font-style:normal;font-size:10px;border:1px solid #D8DCE0;border-radius:4px;padding:1px 5px;margin-left:5px}
  #printDoc .pld{font-variant-numeric:tabular-nums;color:#5A6068;flex-shrink:0}
  #printDoc .pmatch{font-weight:700;color:#C0392B;font-size:12.5px}
  #printDoc .pmeet{font-weight:600;color:#B47A0E;font-size:10.5px}
  #printDoc .prest{color:#A2A8AE}
  #printDoc .pmix{margin-top:20px;break-inside:avoid}
  #printDoc .pmix h4{font-size:12px;margin:0 0 10px;font-weight:700}
  #printDoc .pbar{display:flex;height:14px;border-radius:7px;overflow:hidden;gap:1px;background:#ECEEF1}
  #printDoc .plegend{display:flex;flex-wrap:wrap;gap:7px 15px;margin-top:11px}
  #printDoc .plg{font-size:11px;display:flex;align-items:center;gap:5px}
  #printDoc .plg i{width:8px;height:8px;border-radius:2px;display:inline-block}
  #printDoc .pstats{display:flex;gap:12px;margin-bottom:20px}
  #printDoc .pstat{flex:1;border:1px solid #E2E5E8;border-radius:9px;padding:14px 8px;text-align:center}
  #printDoc .pstat b{display:block;font-size:26px;font-weight:300;letter-spacing:-.02em;font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
  #printDoc .pstat span{font-size:10.5px;color:#838A91;letter-spacing:.04em}
  #printDoc h4.psec{font-size:12px;font-weight:700;margin:0 0 12px}
  #printDoc .pwk{display:flex;align-items:flex-end;gap:16px;height:96px;margin-bottom:22px}
  #printDoc .pwk .c{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px}
  #printDoc .pwk .v{font-size:11px;color:#838A91}
  #printDoc .pwk .bar{width:58%;border-radius:3px 3px 0 0}
  #printDoc .pwk .t{font-size:10px;color:#A2A8AE}
  #printDoc .pdist{display:flex;flex-direction:column;gap:10px}
  #printDoc .pdrow{display:flex;align-items:center;gap:12px}
  #printDoc .pdrow .k{font-size:12px;width:56px;flex-shrink:0}
  #printDoc .pdrow .track{flex:1;height:8px;background:#ECEEF1;border-radius:4px;overflow:hidden}
  #printDoc .pdrow .fill{height:100%;border-radius:4px}
  #printDoc .pdrow .v{font-size:11px;color:#838A91;width:30px;text-align:right;font-variant-numeric:tabular-nums}
  #printDoc footer{margin-top:24px;border-top:1px solid #DBDEE2;padding-top:9px;font-size:10px;color:#A2A8AE;display:flex;justify-content:space-between}
  /* ---------- PRINT: A4 가로(주간/일간/월간) 확대 레이아웃 + 필기 공간 ---------- */
  #printDoc.pl-week,#printDoc.pl-day,#printDoc.pl-month,#printDoc.pl-season,#printDoc.pl-weekboard{font-size:13px}
  #printDoc.pl-week .pwm,#printDoc.pl-day .pwm,#printDoc.pl-month .pwm,#printDoc.pl-season .pwm,#printDoc.pl-weekboard .pwm{font-size:28px}
  #printDoc.pl-week .pmeta strong,#printDoc.pl-day .pmeta strong,#printDoc.pl-month .pmeta strong,#printDoc.pl-season .pmeta strong,#printDoc.pl-weekboard .pmeta strong{font-size:17px}
  #printDoc.pl-week .pdaycol,#printDoc.pl-day .pdaycol{width:46px;font-size:15px}

<script>
// 국면 — 베르하이언/마리치 4-모먼트 모델 + 비전술 카테고리. 색은 국면별 계열색.
const THEMES = [
  {n:'전환',    c:'#34B36B', subs:['공격전환','수비전환']},
  {n:'빌드업',  c:'#E89A33', subs:['빌드업','후방빌드업','전진','포지셔널','비포지셔널']},
  {n:'마무리',  c:'#E85F52', subs:['마무리','마무리구역 진입','마무리 상황']},
  {n:'수비',    c:'#C84B4B', subs:['압박','수비 조직','빌드업 저지','마무리 저지','로우블록','후퇴수비']},
  {n:'세트피스', c:'#2BAFC2', subs:['세트피스 공격','세트피스 수비']},
  {n:'균형',    c:'#8B93A3', subs:['균형 유지']},
  {n:'피지컬',  c:'#4A8BD4', subs:[]},
  {n:'기술·개인', c:'#8E7BE0', subs:[]},
  {n:'리커버리', c:'#5E7E88', subs:[]},
];
const MOMENTS = ['전환','빌드업','마무리','수비','세트피스','균형'];
const BIG_OF = {};
THEMES.forEach(t=>{ BIG_OF[t.n]=t.n; t.subs.forEach(s=>BIG_OF[s]=t.n); });
// 레거시 호환 (옛 데이터·저장본의 옛 국면명 흡수 → 새 8버킷)
Object.assign(BIG_OF, {
  '공격':'빌드업','전개':'마무리','침투':'마무리',
  '역습':'전환','빠른전개':'전환','즉시압박':'전환',
  '전방압박':'수비','지역방어':'수비','견제':'수비','회복':'리커버리',
});
function bigOf(name){ return BIG_OF[name]||name; }
function themeColor(name){ const t=THEMES.find(x=>x.n===bigOf(name)); return t?t.c:'var(--text-3)'; }
function subsOf(big){ const t=THEMES.find(x=>x.n===big); return t?t.subs:[]; }
function distName(k){ return k?k:'국면 미정'; }
function distColor(k){ return k?themeColor(k):'#C2C7CF'; }
function leafMeta(label){
  for(const n of PH2){ if(n.O&&n.O.lab===label) return {ax:'O',num:n.num}; if(n.D&&n.D.lab===label) return {ax:'D',num:n.num}; if(n.name===label) return {ax:'O',num:n.num}; }
  const i=NONTAC.indexOf(label); if(i>=0) return {ax:'NT',num:i+1};
  for(const n of PH2){ if(n.O&&phSearch(n.O,[],label)) return {ax:'O',num:n.num}; if(n.D&&phSearch(n.D,[],label)) return {ax:'D',num:n.num}; }
  return null;
}
function distColorAx(label){   // 공격=파랑 · 수비=빨강 · 전환=회색 · 세트피스=초록 · 그 외=회색
  if(!label) return 'hsl(215 10% 74%)';
  const m=leafMeta(label); if(!m) return 'hsl(215 10% 74%)';
  if(m.ax==='NT'){ const L=[42,53,64][m.num-1]||53; return 'hsl(215 9% '+L+'%)'; }   // 비전술 회색
  if(m.num===1) return 'hsl(215 9% '+(m.ax==='D'?48:60)+'%)';                          // 전환 회색
  if(m.num===4) return 'hsl(150 42% '+(m.ax==='D'?42:54)+'%)';                         // 세트피스 초록
  if(m.num===5) return 'hsl(215 9% 60%)';                                              // 균형 회색
  const L = m.num===2?48:58;                                                           // 빌드업/마무리 명도차
  return m.ax==='D' ? ('hsl(6 64% '+L+'%)') : ('hsl(214 56% '+L+'%)');                 // 수비=빨강 · 공격=파랑
}
function distKey(b){   // 분포 집계 키 = 국면+축 (빌드업 / 빌드업 저지 …), 세부는 그 축으로 합산
  const p=b&&b.phase2;
  if(p){ if(p.nt) return p.nt; if(p.num!=null){ const n=phNode(p.num); if(n) return p.axis?n[p.axis].lab:n.name; } if(p.custom!=null) return p.custom; }
  return (b&&b.theme)||'';
}

// ───────── 2축 국면 모델 (O 소유 / D 비소유 · 번호=대칭) ─────────
const PH2 = [
  {num:1, name:'전환',   O:{lab:'공격전환'}, D:{lab:'수비전환'}},
  {num:2, name:'빌드업', O:{lab:'빌드업', subs:[{lab:'후방빌드업'},{lab:'전진', subs:[{lab:'포지셔널'},{lab:'비포지셔널'}]}]}, D:{lab:'빌드업 저지'}},
  {num:3, name:'마무리', O:{lab:'마무리', subs:[{lab:'마무리구역 진입'},{lab:'마무리 상황'}]}, D:{lab:'마무리 저지'}},
  {num:4, name:'세트피스', O:{lab:'세트피스 공격'}, D:{lab:'세트피스 수비'}},
  {num:5, name:'균형',   O:{lab:'균형 유지'}, D:{lab:'균형 유지'}},
];
const NONTAC=['피지컬','기술·개인','리커버리'];
function phNode(num){ return PH2.find(x=>x.num===num); }
function phStr(p){
  if(!p) return '';
  if(p.nt) return p.nt;
  if(p.custom!=null) return p.custom;
  if(p.num==null) return '';
  const node=phNode(p.num); if(!node) return '';
  if(!p.axis) return node.name;
  let cur=node[p.axis]; let lab=cur.lab;
  (p.path||[]).forEach(step=>{ const nx=(cur.subs||[]).find(z=>z.lab===step); if(nx){cur=nx;lab=nx.lab;} });
  return lab;
}
function phCode(p){
  if(!p||p.nt||p.custom!=null||p.num==null) return '';
  if(!p.axis) return String(p.num);
  const node=phNode(p.num); let cur=node[p.axis]; let code=p.axis+'.'+p.num;
  (p.path||[]).forEach(step=>{ const subs=cur.subs||[]; const idx=subs.findIndex(z=>z.lab===step); if(idx>=0){ code+='.'+(idx+1); cur=subs[idx]; } });
  return code;
}
function phSearch(cur,path,str){ for(const z of (cur.subs||[])){ const np=path.concat(z.lab); if(z.lab===str) return np; const d=phSearch(z,np,str); if(d) return d; } return null; }
function phFromStr(str){
  if(!str) return null;
  if(NONTAC.includes(str)) return {nt:str};
  for(const node of PH2){
    if(node.name===str) return {num:node.num};
    for(const ax of ['O','D']){ const cur=node[ax]; if(!cur) continue;
      if(cur.lab===str) return {num:node.num,axis:ax,path:[]};
      const f=phSearch(cur,[],str); if(f) return {num:node.num,axis:ax,path:f};
    }
  }
  return {custom:str};
}
function phSlot(ns){
  const tr=curTr();
  if(ns==='S') return {get:()=>tr.aimsP, set:o=>{ tr.aimsP=o; tr.aims=phStr(o); }, leg:()=>tr.aims};
  const bi=+ns.slice(1); const b=tr.blocks[bi];
  return {get:()=>b.phase2, set:o=>{ b.phase2=o; b.theme=phStr(o); }, leg:()=>b.theme};
}
function phPick(ns,kind,a,bb){
  const sl=phSlot(ns); let p=sl.get()||{};
  if(kind==='num'){ const num=+a; p=(p.num===num&&!p.axis&&!p.nt)?{}:{num:num}; }
  else if(kind==='axis'){ const ax=a; p=(p.axis===ax)?{num:p.num}:{num:p.num,axis:ax,path:[]}; }
  else if(kind==='sub'){ const lvl=+a, lab=bb; let path=(p.path||[]).slice();
      if(path[lvl]===lab){ path=path.slice(0,lvl); } else { path=path.slice(0,lvl); path[lvl]=lab; }
      p={num:p.num,axis:p.axis,path:path}; }
  else if(kind==='nt'){ p=(p.nt===a)?{}:{nt:a}; }
  else if(kind==='defq'){ p={num:+a,axis:'D',path:[]}; __phDef[ns]=false; }
  sl.set((p && (p.num!=null||p.nt))?p:null);
  if(ns==='S'){ const tr=curTr();
    if(tr.aims==='리커버리'){ tr.load={rec:true}; tr.fitness=undefined; }
    else { const Lx=getLoad(tr); if(Lx&&Lx.rec){ tr.load=null; tr.fitness=undefined; } } }
  renderSession(); if(curSession && !curSession.draft) renderWeek();
}
let __phDef={};
function phDefToggle(ns){ __phDef[ns]=!__phDef[ns]; renderSession(); if(curSession && !curSession.draft) renderWeek(); }
function goForms(){try{parent.postMessage({source:'process',type:'goApp',app:'print'},'*');}catch(_){}}
function phFree(ns,v){ const sl=phSlot(ns); sl.set(v?{custom:v}:null); if(curSession && !curSession.draft) renderWeek(); }
function axCol(ax){ return ax==='O'
  ? {soft:'#FBF1E0',line:'#E9CB97',ink:'#8a6526',c:'#C99250'}
  : {soft:'#EEF0F4',line:'#CDD4E0',ink:'#525c6f',c:'#7E8BA3'}; }
function phCellRaw(ns,num,lab,on){
  const a=axCol('D');
  const st=on?('background:'+a.c+';border-color:'+a.c+';color:#fff'):('background:#fff;border-color:'+a.line+';color:'+a.ink);
  const cc=on?'rgba(255,255,255,.9)':a.c;
  return '<div class="phc" style="'+st+'" onclick="phPick(\''+ns+'\',\'defq\','+num+')"><span class="phc-c" style="color:'+cc+'">D.'+num+'</span><span class="phc-t">'+lab+'</span></div>';}
function phCell(ns,ax,kind,lvl,lab,code,on){
  const a=axCol(ax);
  const st=on?('background:'+a.c+';border-color:'+a.c+';color:#fff'):('background:#fff;border-color:'+a.line+';color:'+a.ink);
  const cc=on?'rgba(255,255,255,.9)':a.c;
  const esc=(lab||'').replace(/'/g,"\\'");
  const oc=(kind==='axis')?("phPick('"+ns+"','axis','"+ax+"')"):("phPick('"+ns+"','sub',"+lvl+",'"+esc+"')");
  return '<div class="phc" style="'+st+'" onclick="'+oc+'"><span class="phc-c" style="color:'+cc+'">'+code+'</span><span class="phc-t">'+lab+'</span></div>';
}
function phaseControlHTML(ns){
  const sl=phSlot(ns); let p=sl.get();
  if(!p){ const ls=sl.leg(); if(ls){ p=phFromStr(ls); sl.set(p); } }
  p=p||{};
  const gk=PH2.map(n=>{ const on=(p.num===n.num&&!p.nt);
    const code=(on&&p.axis)?('<span class="gk-c">'+phCode(p)+'</span>'):'';
    const lab=on?phStr(p):n.name; const car=on?' <span class="gk-car">▾</span>':'';
    return '<button class="fp ph-gk '+(on?'on':'')+'" onclick="phPick(\''+ns+'\',\'num\','+n.num+')">'+code+lab+car+'</button>';
  }).join('')
  + '<button class="fp ph-gk '+((p.axis==='D'&&p.num!=null)||__phDef[ns]?'on':'')+'" style="border-color:#D8A7A7" onclick="phDefToggle(\''+ns+'\')">수비 <span class="gk-car">▾</span></button>';
  let exp='';
  if(__phDef[ns]){
    const DQ=[[1,'수비전환'],[2,'빌드업 저지'],[3,'마무리 저지'],[4,'세트피스 수비']];
    exp+='<div class="ph-exp"><div class="ph-eh"><span class="ph-n">D</span> 수비 <em>· 상대가 공을 가졌을 때</em></div><div class="ph-pair">'
      + DQ.map(q=>{const on=(p.axis==='D'&&p.num===q[0]);
        return phCellRaw(ns,q[0],q[1],on);}).join('')
      + '</div></div>';
  }
  if(p.num!=null && !p.nt){
    const node=phNode(p.num);
    let h='<div class="ph-exp"><div class="ph-eh"><span class="ph-n">'+p.num+'</span> '+node.name+' <em>· 누가 공을 가졌나</em></div><div class="ph-pair">'
      + phCell(ns,'O','axis',null,node.O.lab,'O.'+p.num,p.axis==='O')
      + phCell(ns,'D','axis',null,node.D.lab,'D.'+p.num,p.axis==='D')
      + '</div>';
    if(p.axis){
      let cur=node[p.axis], lvl=0;
      const lvlName=['어디서','어떻게','세부','세부'];
      while(cur.subs && cur.subs.length){
        const items=cur.subs.map(z=>{
          const path=(p.path||[]).slice(0,lvl).concat(z.lab);
          const on=(p.path||[])[lvl]===z.lab;
          return phCell(ns,p.axis,'sub',lvl,z.lab, phCode({num:p.num,axis:p.axis,path:path}), on);
        }).join('');
        h+='<div class="ph-nest"><div class="ph-eh sm">'+(lvlName[lvl]||'세부')+'</div><div class="ph-pair">'+items+'</div></div>';
        const chosen=(p.path||[])[lvl]; if(!chosen) break;
        cur=cur.subs.find(z=>z.lab===chosen); lvl++; if(!cur) break;
      }
    }
    exp=h+'</div>';
  }
  const ntrow=NONTAC.map(n=>{ const c=(THEMES.find(t=>t.n===n)||{}).c||'#999'; const on=p.nt===n;
    return '<button class="fp ph-gk '+(on?'on':'')+'" onclick="phPick(\''+ns+'\',\'nt\',\''+n+'\')"><span class="cdot" style="background:'+c+';margin-right:6px;vertical-align:middle"></span>'+n+'</button>';
  }).join('');
  const free=(p.custom!=null)?p.custom:'';
  const fhtml='<input class="chipfree" type="text" value="'+(free||'').replace(/"/g,'&quot;')+'" placeholder="주제 직접 입력 — 자유롭게 (내 용어로)" oninput="phFree(\''+ns+'\',this.value)">';
  return '<div class="ph-gkrow fmtpick">'+gk+'</div>'+exp+fhtml+'<div class="ph-div"></div><div class="ph-gkrow fmtpick">'+ntrow+'</div>';
}
(function(){var st=document.createElement('style');st.textContent=
".ph-gkrow{display:flex;flex-wrap:wrap;gap:7px}"+
".fp.ph-gk{display:inline-flex;align-items:center;gap:5px}"+
".fp.ph-gk .gk-c{font-size:9px;font-weight:800;color:#C99250;opacity:.9;font-variant-numeric:tabular-nums}"+
".fp.ph-gk .gk-car{font-size:10px;color:var(--text-3)}"+

function circNum(i){ return ['①','②','③','④','⑤','⑥','⑦','⑧','⑨','⑩'][i] || ('('+(i+1)+')'); }

function trMinutes(tr){ return (tr.blocks||[]).reduce((s,b)=>s+(+b.dur||0),0); }   // 세션 총 소요(분)
function endTime(tr){
  const p=(tr.time||'').split(':'); const h=+p[0], m=+p[1];
  if(isNaN(h)||isNaN(m)) return '';
  const d=new Date(0,0,0,h,m+trMinutes(tr));

// 세션 부하 = 강도 × 시간(분) (sRPE식). 리커버리는 낮게.
function sessionLoadMin(tr){
  const L=getLoad(tr); const min=trMinutes(tr);
  if(!L||L.rec) return Math.round(min*0.3);
  return (loadRpe(L)||5)*min;               // sRPE = 강도(RPE) × 분 — 보드와 동일 스케일
}

// 부하 = 세션 단위, 두 축 (강도 × 볼륨). 리커버리는 별도.
const INT = {'저':{label:'저강도',c:'#5E8FA8',n:1}, '중':{label:'중강도',c:'#6FB5C1',n:2}, '고':{label:'고강도',c:'#C99250',n:3}};
const VOL = {'저':{label:'저볼륨',n:1}, '중':{label:'중볼륨',n:2}, '고':{label:'고볼륨',n:3}};
const LEGACY_LOAD = {
  '회복':   {rec:true},
  '활성화': {int:'저', vol:'중'},
  '인텐시브':{int:'고', vol:'저'},
  '익스텐시브':{int:'저', vol:'고'},
};
function getLoad(o){                       // {rec:true} | {int,vol} | null
  let L = o.load || o.fitness;
  if(typeof L==='string') L = LEGACY_LOAD[L] || null;
  return L;
}
function loadShort(L){
  if(!L) return '';
  if(L.rec) return '리커버리';
  const r=loadRpe(L); const b=rpeBand(r);
  return (b==='저'?'저강도':b==='중'?'중강도':'고강도')+' '+r;
}
function loadColor(L){
  if(!L) return 'var(--text-3)';
  if(L.rec) return '#5A6B72';
  return bandColor(loadRpe(L));
}
// 통일된 부하 점수 — 강도(RPE 1-10). 리커버리=0. 차트·리뷰·평균이 이걸 사용.
function loadScore(L){
  if(!L||L.rec) return 0;
  return loadRpe(L);
}
// 강도 언어 통일: 모든 강도를 RPE(1-10)로. 레거시 {int}는 매핑해서 흡수.
function loadRpe(L){
  if(!L||L.rec) return 0;
  if(L.rpe) return +L.rpe;
  if(L.int) return ({'저':3,'중':5,'고':8})[L.int]||5;
  return 0;
}
function rpeBand(r){ r=+r||0; return r<=3?'저':r<=6?'중':'고'; }
function bandColor(r){
  r=Math.max(1,Math.min(10,+r||1));
  const stops=[[1,[88,132,194]],[5,[170,174,180]],[10,[217,72,59]]];
  let a=stops[0],b=stops[stops.length-1];
  for(let i=0;i<stops.length-1;i++){ if(r>=stops[i][0]&&r<=stops[i+1][0]){ a=stops[i]; b=stops[i+1]; break; } }
  const t=(b[0]===a[0])?0:(r-a[0])/(b[0]-a[0]);
  const c=k=>Math.round(a[1][k]+(b[1][k]-a[1][k])*t);
  return `rgb(${c(0)},${c(1)},${c(2)})`;
}
// MD 위치 → 권장 RPE 밴드 (가이드일 뿐, 코치가 자유 설정)
function mdRecRpe(mdStr){
  if(!mdStr||mdStr==='MD') return null;
  const mm=mdStr.match(/[+-]\d+/); const n=mm?parseInt(mm[0],10):0;
  const map={'-5':[2,4],'-4':[7,9],'-3':[6,8],'-2':[5,7],'-1':[3,5],'1':[1,3],'2':[1,3]};
  const v=map[String(n)]; return v?{lo:v[0],hi:v[1]}:null;
}
// MD까지 남은 일수 → 부하 자동 추천 (없으면 코치가 바꿈)
function fitnessForMD(md){
  if(md<=1) return {int:'저',vol:'중'};   // 경기 임박: 가볍게
  if(md===2) return {int:'중',vol:'중'};
  if(md===3) return {int:'저',vol:'고'};   // Extensive
  if(md===4) return {int:'고',vol:'저'};   // Intensive
  return {rec:true};
}

// ── 디에고 모델: MD별 그날의 성격 (주제 + 부하성격 + 블록 템플릿) ──
// 경기(MD)를 기준으로, 남은 일수가 그날 무엇을 훈련할지 결정한다.
const MD_TEMPLATE = {
  5:{aims:'피지컬',   fitness:'익스텐시브', blocks:[['웜업','리커버리','론도',12],['메인훈련','피지컬','서킷',35]]},

  2:{aims:'세트피스',  fitness:'활성화',   blocks:[['웜업','공격전환','',12],['보조훈련','세트피스','',20],['메인훈련','수비','경기',25]]},
  1:{aims:'상대 대응', fitness:'활성화',   blocks:[['웜업','공격전환','론도',12],['보조훈련','수비전환','SSG',18],['메인훈련','세트피스','',15]]},
};

// 주 길이별로 어떤 MD를 살릴지 — 짧아지면 토대(MD-5/-4)부터 잘린다 (디에고 7/5/4/3/2일 표)
const WEEK_PATTERN = {
  2:[2,1],
  3:[3,2,1],
  4:[4,3,2,1],
  5:[5,4,3,2,1],
};
function blocksFrom(tpl){
  return tpl.map(b=>({phase:b[0],theme:b[1],fmt:b[2]||'',dur:b[3]||PHASE_DUR[b[0]]||15,desc:''}));
}
// 훈련일수(2~5)와 경기 요일 인덱스를 받아 한 주를 디에고식으로 자동 생성
function buildWeekFromMD(trainDays, matchIdx){
  const DAYS=['월','화','수','목','금','토','일'];
  const w=DAYS.map((d,i)=>({d,n:i+1,rest:true,trainings:[]}));
  // 경기일
  w[matchIdx]={d:DAYS[matchIdx],n:matchIdx+1,md:'MD',match:{time:'15:00',opp:'상대팀'},trainings:[]};
  // MD-k 를 (경기일 - k) 위치에 배치. 주가 짧으면 먼 날(MD-5/-4)부터 빠진다.
  const pat=WEEK_PATTERN[trainDays]||WEEK_PATTERN[4];
  pat.forEach(md=>{
    const idx=matchIdx-md;
    if(idx<0) return;
    const tpl=MD_TEMPLATE[md];
    w[idx]={d:DAYS[idx],n:idx+1,md:'MD-'+md,
            trainings:[{time:'18:00',aims:tpl.aims,fitness:tpl.fitness,blocks:blocksFrom(tpl.blocks)}]};
  });
  // 경기 다음 날 회복(있으면)
  if(matchIdx+1<=6){
    w[matchIdx+1]={d:DAYS[matchIdx+1],n:matchIdx+2,md:'MD+1',fitness:'회복',aims:'',rest:true,trainings:[]};
  }
  return w;
}


let weeksMap = {0: blankWeek() };   // 첫 실행 = 빈 주 (데모 데이터 없음)

function mondayOfWeek0(){ const t=new Date(); const off=(t.getDay()+6)%7; const m=new Date(t); m.setDate(t.getDate()-off); m.setHours(0,0,0,0); return m; }
function dateOf(offsetDays){ const m=mondayOfWeek0(); m.setDate(m.getDate()+offsetDays); return m; }
function weekDateLabel(n){
  const s=dateOf(n*7), e=dateOf(n*7+6);

function gotoWeek(delta){

function dupWeek(){
  if(curSession) return;
  const src=weeksMap[wk]||blankWeek();
  const hasContent=src.some(d=>(d.trainings||[]).length);
  if(!hasContent) return;          // 빈 주는 복제할 게 없음
  const copy=JSON.parse(JSON.stringify(src));

}

// 로컬 작업 버퍼: IndexedDB(window.storage) 우선, 없으면 localStorage 폴백
function lsGet(k){return (window.storage?window.storage.get(k).then(r=>r?r.value:null).catch(()=>{try{return localStorage.getItem(k);}catch(_){return null;}}):Promise.resolve((function(){try{return localStorage.getItem(k);}catch(_){return null;}})()));}
function lsSet(k,v){if(window.storage){window.storage.set(k,v).catch(()=>{try{localStorage.setItem(k,v);}catch(_){}});return;}try{localStorage.setItem(k,v);}catch(_){}}
function compact(o){try{return JSON.parse(JSON.stringify(o,(k,v)=>typeof v==='number'?Math.round(v*10)/10:v));}catch(_){return o;}}
var __hist=[], __undoing=false;

function __undoBtnSync(){ try{ var b=document.getElementById('undoBtn'); if(b) b.disabled=(__hist.length<2); }catch(_){} }
function pushHist(){
  if(__undoing) return;
  var s=__snap(); if(s===null) return;
  if(__hist.length && __hist[__hist.length-1]===s) return;
  __hist.push(s); if(__hist.length>60) __hist.shift();

}
function doUndo(){
  if(__hist.length<2){ try{toast('되돌릴 게 없어요');}catch(_){} return; }
  __hist.pop();
  var prev=__hist[__hist.length-1];
  __undoing=true;
  try{ weeksMap=JSON.parse(prev); if(!weeksMap[wk]) weeksMap[wk]=blankWeek(); week=weeksMap[wk]; recomputeMD(); }catch(_){}
  __undoing=false;
  try{save();}catch(_){}

function renderPreview(days){
  const wrap=document.getElementById('pvBars'); if(!wrap) return;   // 예상 흐름 제거됨
  days=clampDay(days);
  let phases;
  if(days<=10){

  } else {
    const weeks=Math.round(days/7);
    const n=Math.min(6,Math.max(3,weeks));          // 보여줄 매크로 블록 수 (최대 6)
    phases=[];
    for(let i=0;i<n;i++){
      const frac=i/(n-1);
      let label,load;
      if(i===n-1){label='테이퍼';load=5;}
      else if(i===0){label='토대';load=6.2;}
      else if(frac>0.62){label='정점';load=9.2;}
      else if(frac>0.32){label='모델';load=7.6;}

  const ts=day.trainings||[]; if(!ts.length) return null;
  let rec=false, r=0;

function dayBoard(day){
  if(!day) return {sched:'',theme:'',meet:'',load:'',warm:'',trains:['','','','','']};
  if(!day.board || !('theme' in day.board)){
    var b={sched:'',theme:'',meet:(day.meeting||''),load:'',warm:'',trains:[],trainThemes:['','','','','']};
    if(day.match) b.sched='경기';
    else if(day.off) b.sched='OFF';
    else if((day.trainings||[]).length) b.sched='훈련';
    (day.trainings||[]).forEach(function(tr){
      var a=tr.aims||'';
      if(!b.theme){
        if(/세트피스|set/i.test(a)) b.theme='세트피스';
        else if(/전환|transition/i.test(a)) b.theme='전환';
        else if(/수비|압박|저지|블록/.test(a)) b.theme='수비';
        else if(/공격|마무리|빌드업|전진/.test(a)) b.theme='공격';
      }
      if(/회복|리커버리|recover/i.test(a) && !b.load) b.load='낮음';
      var hadBlk=false;
      (tr.blocks||[]).forEach(function(bl){
        var t=((bl.theme||'')+(bl.desc?(' '+bl.desc):'')).trim();
        if((''+(bl.phase||'')).indexOf('웜업')>=0){ if(!b.warm) b.warm=t; }
        else if(t && b.trains.length<5){ b.trains.push(t); hadBlk=true; }
      });
      if(!hadBlk && a && b.trains.length<5) b.trains.push(a);
    });
    day.board=b;
  }
  var bb=day.board;
  if(!('sched' in bb)) bb.sched='';
  if(!('theme' in bb)) bb.theme='';
  if(!('meet' in bb)) bb.meet=(day.meeting||'');
  if(!('load' in bb)) bb.load='';
  if(!('warm' in bb)) bb.warm='';
  if(!bb.trains) bb.trains=[];
  while(bb.trains.length<5) bb.trains.push('');
  if(bb.trains.length>5) bb.trains=bb.trains.slice(0,5);
  if(!bb.trainThemes) bb.trainThemes=['','','','',''];
  while(bb.trainThemes.length<5) bb.trainThemes.push('');
  return bb;
}

/* ---------- 경기 편집 ---------- */
const WDAYS=['월','화','수','목','금','토','일'];
function recomputeMD(W){
  W = W || week;
  const mis = W.map((d,i)=>d.match?i:-1).filter(i=>i>=0);
  W.forEach((d,i)=>{
    if(d.match){ d.md='MD'; return; }      // 경기일은 항상 MD
    if(d.mdManual) return;                  // 수동 지정은 건드리지 않음
    if(!mis.length){ d.md=''; return; }
    // 가장 가까운 경기 기준 (동률이면 다가오는 경기 우선)
    let best=null, bestAbs=99;
    mis.forEach(mi=>{ const a=Math.abs(i-mi);
      if(a<bestAbs || (a===bestAbs && mi>i)){ best=mi; bestAbs=a; } });
    const diff=i-best;
    if(diff < -5 || diff > 1){ d.md=''; return; }   // MD-5 ~ MD+1 범위만 표시
    d.md = diff<0?('MD'+diff) : ('MD+'+diff);
  });
}

/* ---------- 공용 삭제 + 뷰 동기화 (주간·월간·일간 단일 경로) ---------- */
function delEntry(r,col,kind,ti){          // 월간 팝업·주간 ×가 함께 쓰는 삭제 코어
  const W=weeksMap[r]; if(!W) return; const day=W[col];
  if(kind==='match'){ delete day.match; }
  else if(kind==='meet'){ delete day.meeting; }
  else if(day.trainings){ day.trainings.splice(ti,1); }
  if(!day.match && !(day.trainings&&day.trainings.length)){ day.rest=true; }
  recomputeMD(W);
}
function weekDelTr(di,ti){

/* ---------- 날짜 허브 모달 — ＋ 하나로 그 날의 추가·삭제 전부 (주간·일간 공용) ---------- */
let __hub=null;

function renderDayHub(focusMeet){
  if(!__hub) return;

  const day=W[col]; const dt=dateOf(r*7+col);

  const esc=wkbdEsc;

  if(day.off) list+=`<div class="hub-item"><span class="ht" style="cursor:default">OFF</span><button class="hub-x" onclick="hubClearOff()">해제</button></div>`;

  (day.trainings||[]).forEach((tr,ti)=>{

      list+=`<div class="hub-item"><input id="hubTrInp" type="text" maxlength="80" value="${esc(tr.aims||'')}" placeholder="일정 입력"><button class="hub-x" onclick="hubDelTr(${ti})">삭제</button></div>`;
    } else {
      list+=`<div class="hub-item"><span class="ht" onclick="hubRenameTr(${ti})"><span class="cdot" style="background:${c}"></span>${esc(tr.aims||'훈련')}${min?` <span class="sub">· ${min}분</span>`:''}</span><button class="hub-x" onclick="hubDelTr(${ti})">삭제</button></div>`;
    }
  });
  const meetVal=(day.meeting||'').trim();
  if(meetVal||__hub.meetNew){
    list+=`<div class="hub-item meet"><input id="hubMeetInp" type="text" maxlength="60" value="${esc(meetVal)}" placeholder="미팅 주제 — 예: 상대 분석 영상"><button class="hub-x" onclick="hubDelMeet()">삭제</button></div>`;
  }

  const sheet=document.getElementById('sheet');
  sheet.innerHTML=`<button class="closex" onclick="closeSheet()">×</button>
    <h3>${dt.getMonth()+1}월 ${dt.getDate()}일 (${wd})${day.md?` <span class="htot">· ${day.md}</span>`:''}</h3>
    <div class="sub">이 날의 일정 — 추가도 삭제도 여기서</div>
    ${listHtml}
    <div class="hub-add"><input id="hubTextInp" type="text" maxlength="80" placeholder="일정 입력 후 Enter — 예: 오후 훈련"></div>`;
  const mi=document.getElementById('hubMeetInp');
  if(mi){
    mi.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); mi.blur(); } });
    mi.addEventListener('blur',()=>{
      if(!__hub) return;
      const v=mi.value.trim(); const d=weeksMap[__hub.r][__hub.col];
      if(v) d.meeting=v; else delete d.meeting;
      __hub.meetNew=false; syncViews();
    });
    if(focusMeet) setTimeout(()=>mi.focus(),0);
  }
  const ai=document.getElementById('hubTextInp');
  if(ai){
    ai.addEventListener('keydown',e=>{
      if(e.key==='Enter'){ e.preventDefault();
        const v=ai.value.trim(); if(!v||!__hub) return;
        const day=weeksMap[__hub.r][__hub.col];
        day.off=false; day.rest=false; day.trainings=day.trainings||[];
        day.trainings.push({time:'',players:'',aims:v,note:'',slot:'',load:{},blocks:[]});
        __hub.editTr=null; syncViews(); renderDayHub();
        setTimeout(()=>{ const n=document.getElementById('hubTextInp'); if(n) n.focus(); },0);
      }
    });
  }
  const ei=document.getElementById('hubTrInp');
  if(ei){
    const saveEi=()=>{ if(!__hub) return; const v=ei.value.trim(); const day=weeksMap[__hub.r][__hub.col]; const ti=__hub.editTr;
      if(day&&day.trainings&&day.trainings[ti]!=null){ if(v) day.trainings[ti].aims=v; else day.trainings.splice(ti,1); }
      __hub.editTr=null; syncViews(); renderDayHub(); };
    ei.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); saveEi(); } else if(e.key==='Escape'){ __hub.editTr=null; renderDayHub(); } });
    ei.addEventListener('blur',saveEi);

  }
}

function syncViews(){                      // 모든 변경 후 단일 호출 — 살아있는 뷰 전부 갱신 + 저장
  try{recomputeMD();}catch(_){}

  try{const m=document.getElementById('monthViewWrap'); if(m&&m.style.display!=='none') renderMonth();}catch(_){}

function updateTopMini(){
  const el=document.querySelector('#schedule .top .mini'); if(!el) return;
  const today=new Date(); today.setHours(0,0,0,0);
  let best=null, opp='';
  Object.keys(weeksMap).forEach(r=>{ const W=weeksMap[r]; if(!W)return; W.forEach((d,di)=>{ if(d&&d.match){ const dt=dateOf((+r)*7+di); if(dt>=today && (best===null||dt<best)){ best=dt; opp=(d.match.opp||'').trim(); } } }); });
  el.classList.add('tap'); el.setAttribute('onclick','editDday()');
  const e=t=>t.replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));
  if(best){ const days=Math.round((best-today)/86400000); el.innerHTML = (days<=0?'오늘 경기':('D-'+days)) + (opp?(' · '+e(opp)):''); }
  else { el.innerHTML='다음 경기 미정'; }
}

/* ---------- MD 직접 설정 (경기일 기준 라벨) ---------- */
const MD_OPTS=['MD-5','MD-4','MD-3','MD-2','MD-1','MD+1','MD+2','MD+3'];
function openDayMD(di){
  const day=week[di];
  if(day.match){   // 경기일은 MD 고정 — 경기 설정으로 안내
    openMatch(di); return;
  }
  const sheet=document.getElementById('sheet');
  const cur=day.mdManual?day.md:'';
  const autoOn = day.mdManual?'':'on';
  const chips=MD_OPTS.map(v=>`<button class="fp ${cur===v?'on':''}" onclick="setDayMD(${di},'${v}')">${v}</button>`).join('');
  sheet.innerHTML=`<button class="closex" onclick="closeSheet()">×</button>
    <h3>${day.d}요일 — MD 설정</h3>
    <div class="sub">경기일 기준 며칠째인지. ‘자동’은 경기 위치에서 계산하고, 직접 고르면 고정됩니다. <b>MD</b>를 누르면 이 날이 경기일이 됩니다.</div>
    <div class="fmtpick">
      <button class="fp ${autoOn}" onclick="setDayMD(${di},'')">자동</button>
      <button class="fp mdmatchopt" onclick="setDayMD(${di},'MD')"><span class="cdot" style="background:var(--match);margin-right:5px;vertical-align:middle"></span>MD · 경기</button>
      ${chips}
    </div>
    <button class="savebtn" style="margin-top:12px" onclick="closeSheet()">완료</button>`;
  document.getElementById('scrim').classList.add('show');
}
function setDayMD(di,v){
  const day=week[di];
  if(v==='MD'){ addMatchOn(di); return; }     // 이 날을 경기일로 지정 → 경기 설정 열림
  if(v===''){ day.mdManual=false; recomputeMD(); }
  else { day.md=v; day.mdManual=true; }
  syncViews(); openDayMD(di);
}

/* ---------- review data (실데이터, 부하 = 강도×시간) ---------- */
function reviewStats(){
  let sessions=0, mins=0, loadSum=0;
  const perDay=[];   // {d, load, match}
  const dist={};     // 국면(big) → 분
  week.forEach(day=>{
    let dLoad=0, dRpe=0, dN=0;
    (day.trainings||[]).forEach(tr=>{
      sessions++;
      const sl=sessionLoadMin(tr); dLoad+=sl; loadSum+=sl;
      dRpe+=(loadRpe(getLoad(tr))||0); dN++;
      tr.blocks.forEach(b=>{ const m=+b.dur||0; mins+=m; const g=distKey(b); dist[g]=(dist[g]||0)+m; });
    });
    if(day.match){ const mr=(day.match.rpe!=null?day.match.rpe:MATCH_RPE), mm=(day.match.min!=null?day.match.min:MATCH_MIN); dLoad+=mr*mm; dRpe+=mr; dN++; }
    perDay.push({d:day.d, load:dLoad, match:!!day.match, rpe:dN?Math.round(dRpe/dN):0});
  });
  return {sessions, mins, load:loadSum, avg:sessions?Math.round(loadSum/sessions):0, perDay, dist};
}
const MATCH_RPE=9, MATCH_MIN=90;   // 경기 기본 부하 (RPE 9 × 90분) — 코치가 조정 가능
function weekLoadTotal(wkArr){
  let t=0; wkArr.forEach(day=>{ (day.trainings||[]).forEach(tr=>{ t+=sessionLoadMin(tr); }); if(day.match) t+=(day.match.rpe!=null?day.match.rpe:MATCH_RPE)*(day.match.min!=null?day.match.min:MATCH_MIN); }); return t;
}
function weekRpeAvg(wkArr){ let s=0,n=0; wkArr.forEach(day=>{ (day.trainings||[]).forEach(tr=>{ s+=(loadRpe(getLoad(tr))||0); n++; }); if(day.match){ s+=(day.match.rpe!=null?day.match.rpe:MATCH_RPE); n++; } }); return n?s/n:0; }
function weeklySeries(){            // 정렬된 주 인덱스별 총부하
  const idx=Object.keys(weeksMap).map(Number).sort((a,b)=>a-b);
  return idx.map(i=>({wk:i, total:weekLoadTotal(weeksMap[i]), cur:i===wk, rpe:weekRpeAvg(weeksMap[i])}));
}

  const wmax=Math.max(1,...series.map(s=>s.total));
  const wb=document.getElementById('wbars'); if(wb){ wb.innerHTML='';
    if(series.length<=1 && st.load===0){ wb.innerHTML='<div class="mempty">주를 넘기며 훈련을 짜면 부하 흐름이 그려져요</div>'; }
    series.forEach((s,i)=>{
      const col=document.createElement('div'); col.className='c';
      const h=8+(s.total/wmax)*56;
      const lbl = s.wk===0?'이번':s.wk>0?`+${s.wk}`:`${s.wk}`;
      col.innerHTML=`<div class="vv">${s.total||'·'}</div><div class="lb" style="height:${h}px;background:${bandColor(s.rpe)};opacity:${s.cur?1:.55};animation-delay:${i*60}ms"></div><div class="lt">${lbl}</div>`;
      wb.appendChild(col);
    });
  }

  // 이번 주 요일별 부하
  const lb=document.getElementById('lbars'); lb.innerHTML='';
  const dmax=Math.max(1,...st.perDay.map(x=>x.load));
  st.perDay.forEach((w,i)=>{
    const col=document.createElement('div'); col.className='c';
    const h=8+(w.load/dmax)*56;
    const bg=bandColor(w.rpe);
    col.innerHTML=`<div class="vv">${w.match?'경기':(w.load||'·')}</div><div class="lb" style="height:${h}px;background:${bg};animation-delay:${i*60}ms"></div><div class="lt">${w.d}</div>`;
    lb.appendChild(col);
  });

  const entries=Object.entries(st.dist).sort((a,b)=>b[1]-a[1]);
  const totalMin=entries.reduce((s,e)=>s+e[1],0)||1;
  const d=document.getElementById('dist'); d.innerHTML='';
  if(!entries.length){ d.innerHTML='<div class="mempty">아직 훈련이 없어요</div>'; return; }
  // ⓐ 100% 스택 바 — 주간 모양 한눈에
  const stack=entries.map(([n,m])=>`<div style="width:${m/totalMin*100}%;background:${distColorAx(n)}"></div>`).join('');
  let html=`<div style="display:flex;height:16px;border-radius:8px;overflow:hidden;margin:2px 0 15px;background:var(--surface-2)">${stack}</div>`;
  // ⓑ 정렬 막대 — 길이 = 전체 대비 %, 분 함께
  entries.forEach(([n,m],i)=>{
    const pct=Math.round(m/totalMin*100);
    html+=`<div class="drow"><div class="dk" style="width:90px;word-break:keep-all">${distName(n)}</div><div class="track"><div class="fill" style="width:${m/totalMin*100}%;background:${distColorAx(n)};animation-delay:${i*50}ms"></div></div><div class="dv" style="width:64px;color:var(--text-2)"><b style="color:var(--text);font-weight:700">${pct}%</b> <span style="color:var(--text-3);font-size:10.5px">${m}분</span></div></div>`;
  });
  // ＋ O 소유 / D 비소유 밸런스 (국면 고른 드릴의 phase2 기준)
  let oMin=0,dMin=0;
  week.forEach(day=>(day.trainings||[]).forEach(tr=>tr.blocks.forEach(b=>{ const ax=b.phase2&&b.phase2.axis; if(ax==='O')oMin+=(+b.dur||0); else if(ax==='D')dMin+=(+b.dur||0); })));
  if(oMin+dMin>0){
    const tot=oMin+dMin, op=Math.round(oMin/tot*100), dp=100-op;
    html+=`<div style="font-size:11.5px;color:var(--text-3);font-weight:600;margin:16px 0 7px">소유 vs 비소유 <span style="font-weight:400">· 국면 고른 드릴 기준</span></div>
      <div style="display:flex;height:28px;border-radius:9px;overflow:hidden;font-size:11.5px;font-weight:800;color:#fff">${op?`<div style="width:${op}%;background:hsl(214 56% 50%);display:flex;align-items:center;justify-content:center">${op>=16?'O 소유 '+op+'%':''}</div>`:''}${dp?`<div style="width:${dp}%;background:hsl(6 64% 50%);display:flex;align-items:center;justify-content:center">${dp>=16?'D 비소유 '+dp+'%':''}</div>`:''}</div>`;
  }
  d.innerHTML=html;
}

function pSessionBlock(tr){

function monthDocHTML(){
  let rows='';
  const days=monthGridDays();
  const nRows=days.length/7;                     // 행 높이는 테이블 height:100%로 페이지에 맞춰 균등 분배
  const ruleBg='repeating-linear-gradient(to bottom,transparent 0,transparent calc(8mm - 1px),#EDF0F2 calc(8mm - 1px),#EDF0F2 8mm)';
  // 전역 MD 계산 — recomputeMD는 주 단위라 경기 없는 주의 md가 비어 있음. 모든 주의 경기일(절대 오프셋)을 모아
  // '다가오는 가장 가까운 경기' 기준으로 MD-n(1~9) / MD / MD+1·+2(다음 경기 없을 때)를 계산한다.
  const matchOffs=[];
  if(!__pBlank){
    Object.keys(weeksMap).forEach(rk=>{ (weeksMap[rk]||[]).forEach((d,ci)=>{ if(d&&d.match) matchOffs.push((+rk)*7+ci); }); });
    matchOffs.sort((a,b)=>a-b);
  }
  const mdOfOff=n=>{
    if(matchOffs.indexOf(n)>=0) return 'MD';
    let next=null; for(const m of matchOffs){ if(m>n){ next=m; break; } }
    if(next!=null){ const k=next-n; return k<=9?('MD-'+k):''; }
    let prev=null; for(const m of matchOffs){ if(m<n) prev=m; }
    if(prev!=null){ const k=n-prev; return k<=2?('MD+'+k):''; }
    return '';
  };
  for(let w=0;w<nRows;w++){
    let cells='';
    for(let c=0;c<7;c++){
      const dt=days[w*7+c];
      const out=dt.getMonth()!==monthAnchor.m;
      if(__pBlank){
        // 빈 양식: 이번 달 골격(날짜·요일·셀 필기줄)만 유지, 일정·MD·경기색 전부 제거 (recomputeMD 미호출)
        cells+=`<td style="border:1px solid #E6E8EB;background:${ruleBg},${out?'#F6F7F8':'#ffffff'};padding:4px 3px;vertical-align:top;width:14.28%;${out?'opacity:.45;':''}">
        <div style="display:flex;justify-content:space-between;align-items:baseline;gap:2px"><span style="font-size:11px;color:#5C6068;font-weight:700">${dt.getDate()}</span></div></td>`;
        continue;
      }
      const n=offsetOfDate(dt), r=Math.floor(n/7), col=((n%7)+7)%7;
      const wkArr=weeksMap[r]||blankWeek(); recomputeMD(wkArr);
      const day=wkArr[col]||{};
      const ts=day.trainings||[];
      const isMatch=!!day.match;
      const md=(day.mdManual&&day.md)?day.md:(mdOfOff(n)||day.md||'');
      const empty=!isMatch && !ts.length && !day.off;
      const bg=isMatch?'#FBEBEA':(out?'#F6F7F8':'#ffffff');
      const cellBg=empty?(ruleBg+','+bg):bg;     // 필기줄은 빈 날에만 — 내용 있는 칸은 깨끗하게
      let body='';
      if(isMatch){
        body=`<div style="font-size:8.5px;color:#C24A46;font-weight:800;margin-top:2px;line-height:1.35">경기${day.match.opp?' · '+day.match.opp:''}</div>`
            +(day.match.time?`<div style="font-size:7px;color:#9097A0;margin-top:1px">${day.match.time}</div>`:'');
      } else if(ts.length){
        const tr0=ts[0];
        const mainB=(tr0.blocks||[]).find(b=>b.phase==='메인훈련')||(tr0.blocks||[])[0];
        const dot=mainB?`<span style="display:inline-block;width:5px;height:5px;border-radius:1.5px;background:${distColorAx(mainB.theme)};margin-right:3px;vertical-align:1px"></span>`:'';
        const more=ts.length>1?` <span style="color:#9097A0;font-weight:600">+${ts.length-1}</span>`:'';
        const L=getLoad(tr0);
        const rpeTxt=L?(L.rec?'리커버리':'RPE '+loadRpe(L)):'';
        const rpeDot=L?`<span style="display:inline-block;width:4px;height:4px;border-radius:50%;background:${loadColor(L)};margin:0 2px 0 0;vertical-align:1px"></span>`:'';
        const mins=trMinutes(tr0);
        body=`<div style="font-size:8px;color:#1a1a1a;font-weight:700;margin-top:2px;line-height:1.35">${dot}${tr0.aims||'훈련'}${more}</div>`
            +`<div style="font-size:7px;color:#9097A0;margin-top:1px">${tr0.time||''}${mins?` · 총${mins}분`:''}${rpeTxt?` · ${rpeDot}${rpeTxt}`:''}</div>`;
      } else if(day.off){
        body=`<div style="font-size:8px;color:#A2A8AE;font-weight:600;margin-top:2px">휴식</div>`;
      }
      cells+=`<td style="border:1px solid #E6E8EB;background:${cellBg};padding:4px 3px;vertical-align:top;width:14.28%;${out?'opacity:.45;':''}">
        <div style="display:flex;justify-content:space-between;align-items:baseline;gap:2px"><span style="font-size:10px;color:#33373C;font-weight:800">${dt.getDate()}</span><span style="font-size:8.5px;color:${(isMatch||md==='MD')?'#C24A46':'#9097A0'};font-weight:700">${md}</span></div>${body}</td>`;
    }
    rows+=`<tr>${cells}</tr>`;
  }
  const head=WDAYS.map(d=>`<th style="font-size:10px;color:#9097A0;font-weight:600;padding:3px">${d}</th>`).join('');
  // 데이터 모드 전용 범례 — 강도 점 · 경기 · MD 설명 (빈 양식엔 없음)
  let legend='';
  if(!__pBlank){
    const ldot=c=>`<span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:${c};margin-right:3px"></span>`;
    legend=`<div style="display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center;font-size:7.5px;color:#9097A0;margin-top:5px;flex-shrink:0">`

      +`<span>${ldot(bandColor(10))}최대 (9+)</span>`
      +`<span style="color:#C24A46;font-weight:700">□ 경기</span>`
      +`<span>MD-n = 경기까지 n일</span></div>`;
  }
  return `<div class="ponepage">`+pHeader(monthLabel(),'월간 일정')+
    `<div style="flex:1 1 auto;min-height:0;display:flex;flex-direction:column;margin-top:6px"><table style="width:100%;height:100%;border-collapse:collapse;table-layout:fixed"><thead><tr>${head}</tr></thead><tbody>${rows}</tbody></table></div>`+legend+pFooter()+`</div>`;
}
