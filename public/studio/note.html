<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>훈련 노트</title>
<style>
:focus-visible{outline:2px solid #3a6df0 !important;outline-offset:2px;border-radius:6px;}

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea{-webkit-user-select:text;user-select:text}
:root{--bg:#ECEDF0;--bar:#fff;--line:#E3E5E9;--txt:#16181C;--dim:#5C6068;--blue:#3a6df0}
html,body{height:100%;overflow:hidden;overscroll-behavior:none;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,system-ui,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:var(--txt)}
body{display:flex;flex-direction:column}
.bar{flex:0 0 auto;display:flex;align-items:center;gap:7px;padding:8px 12px;background:var(--bar);border-bottom:1px solid var(--line);flex-wrap:wrap}
.bar input[type=text]{border:1px solid var(--line);border-radius:9px;padding:7px 10px;font-size:13px;font-weight:600;font-family:inherit;flex:1 1 130px;min-width:110px;background:#F7F8FA}
.bar select{border:1px solid var(--line);border-radius:9px;padding:7px 8px;font-size:12.5px;font-family:inherit;background:#fff}
.seg{display:flex;background:#F1F2F4;border:1px solid var(--line);border-radius:10px;padding:2px;gap:2px}
.seg button{border:0;background:transparent;color:var(--dim);font-weight:700;font-size:12.5px;padding:6px 11px;border-radius:8px;cursor:pointer;font-family:inherit}
.seg button.on{background:#fff;color:var(--txt);box-shadow:0 1px 2px rgba(16,24,40,.1)}
.cols{display:flex;gap:5px;align-items:center}
.cols button{width:24px;height:24px;border-radius:50%;border:2px solid transparent;cursor:pointer}
.cols button.on{border-color:var(--txt);box-shadow:0 0 0 2px #fff inset}
.cols input.custcol{width:24px;height:24px;border-radius:50%;border:2px dashed #c2c8d2;padding:0;cursor:pointer;background:#fff;-webkit-appearance:none;appearance:none;overflow:hidden}
.cols input.custcol::-webkit-color-swatch-wrapper{padding:2px}
.cols input.custcol::-webkit-color-swatch{border:none;border-radius:50%}
.cols input.custcol.on{border:2px solid var(--txt)}
.icb{border:1px solid var(--line);background:#fff;border-radius:9px;width:32px;height:32px;cursor:pointer;font-size:13px;color:var(--txt);display:inline-flex;align-items:center;justify-content:center;font-family:inherit}
.icb:disabled{opacity:.45}
.icb.on{background:var(--blue);border-color:var(--blue);color:#fff}
.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 11px;cursor:pointer;font-size:12.5px;font-weight:700;color:var(--txt);font-family:inherit;white-space:nowrap}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff}
.sp{flex:1 1 auto}
.szwrap{display:flex;align-items:center;gap:5px}
.szwrap input{width:74px}
.pg{display:flex;align-items:center;gap:4px;font-size:12px;font-weight:700;color:var(--dim)}
#stage{flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;padding:10px;touch-action:none;position:relative}
#ecur{display:none;position:fixed;border:1.5px solid rgba(60,64,72,.75);background:rgba(255,255,255,.25);border-radius:50%;pointer-events:none;z-index:50;transform:translate(-50%,-50%)}
#cv{background:#fff;border-radius:10px;box-shadow:0 4px 18px rgba(16,24,40,.12);touch-action:none;max-width:100%;max-height:100%}
.ovl{display:none;position:fixed;inset:0;z-index:100;background:rgba(16,24,40,.45);align-items:center;justify-content:center;padding:16px}
.ovl.on{display:flex}
.ovl .card{background:#fff;border-radius:16px;max-width:480px;width:100%;max-height:80vh;overflow:auto;padding:18px}
.ovl h3{font-size:15px;margin-bottom:10px}
.nrow{display:flex;align-items:center;gap:10px;padding:10px 4px;border-top:1px solid var(--line)}
.nrow .nm{flex:1;min-width:0}
.nrow .nm b{font-size:13.5px;display:block}
.nrow .nm span{font-size:11.5px;color:var(--dim)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:rgba(22,24,28,.92);color:#fff;font-size:12.5px;font-weight:600;padding:9px 16px;border-radius:99px;opacity:0;transition:.25s;pointer-events:none;z-index:200}
.toast.on{opacity:1}
@media(max-width:640px){
  .bar{padding:6px 8px;gap:5px}
  .bar input[type=text]{flex-basis:100%}
  .szwrap input{width:56px}
}





/*FMDARK*/
body.fmdark{--bg:#0F141B!important;--bar:#1A212B!important;--line:#2C3744!important;--txt:#E7EBF1!important;--dim:#9AA4B3!important;--blue:#4D7DFF!important;background:#0F141B!important;color:#E7EBF1!important}
body.fmdark .btn,body.fmdark .icb{background:#1A212B!important;border-color:#2C3744!important;color:#E7EBF1!important}
body.fmdark .icb.on{background:var(--blue)!important;border-color:var(--blue)!important;color:#fff!important}
body.fmdark .seg{background:#141A22!important}
body.fmdark .seg button.on{background:#2C3744!important;color:#fff!important}
body.fmdark .cols button.on{box-shadow:0 0 0 2px #2C3744 inset!important}
body.fmdark .btn:disabled,body.fmdark .icb:disabled{opacity:.5!important;color:#7C8696!important}
/*ENDFMDARK*/
</style>
</head>
<body>
<div class="bar">
  <input type="text" id="nTitle" placeholder="노트 제목 (예: 화요일 훈련 메모)">
  <select id="nTpl" title="배경 양식">
    <option value="blank">백지</option>
    <option value="lines">줄노트</option>
    <option value="grid">모눈</option>
    <option value="pitch">축구장</option>
  </select>
  <div class="seg" id="tools">
    <button data-t="pen" class="on">볼펜</button>
    <button data-t="pencil">연필</button>
    <button data-t="hl">형광펜</button>
    <button data-t="text">T 텍스트</button>
    <button data-t="eraser">지우개</button>
  </div>
  <button class="icb" id="penOnly" title="펜 전용 — 손가락 입력 무시"><svg width='15' height='15' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round' style='vertical-align:-2px'><path d='M4 20l1-4L16 5l3 3L8 19z'/><path d='M14 7l3 3'/></svg></button>
  <div class="cols" id="cols"></div>
  <div class="szwrap"><input type="range" id="size" min="1" max="14" step="0.5" value="3" title="굵기"></div>
  <button class="icb" id="undoB" title="실행취소">↩</button>
  <button class="icb" id="redoB" title="다시 실행">↪</button>
  <span class="sp"></span>
  <div class="pg">
    <button class="icb" id="pgPrev">◀</button>
    <span id="pgLbl">1 / 1</span>
    <button class="icb" id="pgNext">▶</button>
    <button class="icb" id="pgAdd" title="페이지 추가">＋</button>
  </div>
  <button class="btn" id="pdfB">PDF 열기</button>
  <button class="icb" id="orientB" title="가로/세로 전환">⤢</button>
  <button class="btn" id="pngB">이미지 저장</button>
  <button class="btn" id="printB">A4 인쇄</button>
  <input type="file" id="pdfFile" accept=".pdf,application/pdf" style="position:fixed;left:-9999px;top:0;width:1px;height:1px;opacity:0;pointer-events:none">
  <button class="btn" id="newB">새 노트</button>
  <button class="btn" id="libB">내 노트</button>
</div>
<div id="stage"><canvas id="cv"></canvas><div id="ecur"></div></div>

<div class="ovl" id="libOvl">
  <div class="card">
    <h3>내 노트</h3>
    <div id="libList"></div>
    <div style="text-align:right;margin-top:10px"><button class="btn" id="libClose">닫기</button></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script src="idb-store.js"></script>
<script>
"use strict";
const $=id=>document.getElementById(id);
let LW=1000, LH=1414;
function applyOrient(){const l=note&&note.orient==='l';LW=l?1414:1000;LH=l?1000:1414;}
const KEY='cs_notes_v1';
const COLORS=['#16181C','#3a6df0','#D6453D','#1D9E75'];
const HL_COLORS={'#16181C':'#FFE066','#3a6df0':'#9FD0FF','#D6453D':'#FFB3AC','#1D9E75':'#A9EBC9'};
let cv=$('cv');
let ctx=cv.getContext('2d',{desynchronized:true})||cv.getContext('2d');
let base=document.createElement('canvas'), bctx=base.getContext('2d');
let note=null, pi=0, tool='pen', color=COLORS[0], size=3;
const SIZES={pen:3,pencil:3,hl:3,eraser:18,text:18};
const SIZE_RANGE={pen:[1,14,0.5],pencil:[1,14,0.5],hl:[1,14,0.5],eraser:[8,72,2],text:[12,44,2]};
let live=null, redoStack=[], saveTimer=null;
let penOnly=false, penSeen=false;

function uid(){return 'n'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function store(){try{return JSON.parse(localStorage.getItem(KEY))||{notes:{},cur:null};}catch(_){return {notes:{},cur:null};}}
function persist(s){var json=null;try{json=JSON.stringify(s);}catch(_){}
  if(json!=null){
    try{localStorage.setItem(KEY,json);}catch(_){
      if(!persist._warned){persist._warned=true;toast('저장 공간이 가득 차 저장되지 않았어요 — 오래된 노트나 PDF를 삭제해주세요');}}
    if(window.storage){window.storage.set(KEY,json).catch(function(){});}
  }
  // 로그인 상태면 부모(셸)가 디바운스 후 Supabase 에 동기화
  try{parent.postMessage({source:'note',type:'cloudSave',kind:'note',payload:json},'*');}catch(_){}}
function blankNote(){return {id:uid(),title:'',tpl:'blank',pages:[{strokes:[]}],created:Date.now(),updated:Date.now()};}
function save(){if(!note)return;note.updated=Date.now();note.title=$('nTitle').value;
  const s=store();s.notes[note.id]=note;s.cur=note.id;persist(s);}
function saveSoon(){clearTimeout(saveTimer);saveTimer=setTimeout(save,400);}
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),1600);}

/* ============ 크기 ============ */
function fit(){
  const st=$('stage'),pad=20;
  const sw=st.clientWidth-pad, sh=st.clientHeight-pad;
  const sc=Math.min(sw/LW, sh/LH);
  const w=Math.max(200,LW*sc), h=LH*sc;
  const dpr=Math.min(3,window.devicePixelRatio||1);
  cv.style.width=w+'px';cv.style.height=h+'px';
  cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);
  base.width=cv.width;base.height=cv.height;
  ctx.setTransform(cv.width/LW,0,0,cv.height/LH,0,0);
  bctx.setTransform(base.width/LW,0,0,base.height/LH,0,0);
  rebuildBase();present();
}
window.addEventListener('resize',fit);

/* ============ 배경 ============ */
const bgCache={};
function drawTpl(c){
  c.save();c.fillStyle='#fff';c.fillRect(0,0,LW,LH);
  const pg=note?note.pages[pi]:null;
  if(pg&&pg.bg){
    let img=bgCache[pg.bg];
    if(!img){img=new Image();img.onload=()=>{rebuildBase();present();};img.src=pg.bg;bgCache[pg.bg]=img;}
    if(img.complete&&img.naturalWidth){
      const sc=Math.min(LW/img.naturalWidth,LH/img.naturalHeight);
      const w=img.naturalWidth*sc,h=img.naturalHeight*sc;
      c.drawImage(img,(LW-w)/2,(LH-h)/2,w,h);
    }
    c.restore();return;
  }
  const t=note?note.tpl:'blank';
  if(t&&t.indexOf('paper:')===0){
    const pp=papers().find(x=>'paper:'+x.id===t);
    if(pp){let img=bgCache[t];
      if(!img){img=new Image();img.onload=()=>{rebuildBase();present();};img.src=pp.img;bgCache[t]=img;}
      if(img.complete&&img.naturalWidth){
        const sc=Math.max(LW/img.naturalWidth,LH/img.naturalHeight);
        const w=img.naturalWidth*sc,h=img.naturalHeight*sc;
        c.drawImage(img,(LW-w)/2,(LH-h)/2,w,h);}}
    c.restore();return;}
  c.strokeStyle='#E7EAF0';c.lineWidth=1.2;
  if(t==='lines'){for(let y=80;y<LH;y+=46){c.beginPath();c.moveTo(50,y);c.lineTo(LW-50,y);c.stroke();}}
  else if(t==='grid'){for(let x=0;x<=LW;x+=40){c.beginPath();c.moveTo(x,0);c.lineTo(x,LH);c.stroke();}
    for(let y=0;y<=LH;y+=40){c.beginPath();c.moveTo(0,y);c.lineTo(LW,y);c.stroke();}}
  else if(t==='pitch'){
    c.strokeStyle='#AEB4BE';c.fillStyle='#AEB4BE';c.lineWidth=2;
    const m=70,W2=LW-m*2,H2=LH-m*2,cx=LW/2,cy=LH/2;
    c.strokeRect(m,m,W2,H2);
    c.beginPath();c.moveTo(m,cy);c.lineTo(LW-m,cy);c.stroke();
    const ccR=Math.min(W2,H2)*0.13;
    c.beginPath();c.arc(cx,cy,ccR,0,Math.PI*2);c.stroke();
    c.beginPath();c.arc(cx,cy,3.5,0,Math.PI*2);c.fill();
    const bw=W2*0.6,bh=H2*0.16;
    c.strokeRect(cx-bw/2,m,bw,bh);c.strokeRect(cx-bw/2,LH-m-bh,bw,bh);
    const gw=W2*0.3,gh=H2*0.06;
    c.strokeRect(cx-gw/2,m,gw,gh);c.strokeRect(cx-gw/2,LH-m-gh,gw,gh);
    const ps=bh*0.62;
    c.beginPath();c.arc(cx,m+ps,3.5,0,Math.PI*2);c.fill();
    c.beginPath();c.arc(cx,LH-m-ps,3.5,0,Math.PI*2);c.fill();
    c.beginPath();c.arc(cx,m+ps,ccR,0.30*Math.PI,0.70*Math.PI);c.stroke();
    c.beginPath();c.arc(cx,LH-m-ps,ccR,1.30*Math.PI,1.70*Math.PI);c.stroke();
    const ca=16;
    c.beginPath();c.arc(m,m,ca,0,0.5*Math.PI);c.stroke();
    c.beginPath();c.arc(LW-m,m,ca,0.5*Math.PI,Math.PI);c.stroke();
    c.beginPath();c.arc(LW-m,LH-m,ca,Math.PI,1.5*Math.PI);c.stroke();
    c.beginPath();c.arc(m,LH-m,ca,1.5*Math.PI,2*Math.PI);c.stroke();
  }
  c.restore();
}

/* ============ 획 렌더 — 리본 (저장본·완성본용) ============ */
function ribbon(c,s){
  const pts=s.pts,n=pts.length;
  if(n===0)return;
  c.fillStyle=s.color;
  if(n===1){c.beginPath();c.arc(pts[0].x,pts[0].y,(pts[0].w||s.size)/2,0,Math.PI*2);c.fill();return;}
  const L=[],R=[];
  for(let i=0;i<n;i++){
    const a=pts[Math.max(0,i-1)],b=pts[Math.min(n-1,i+1)];
    let dx=b.x-a.x,dy=b.y-a.y;const len=Math.hypot(dx,dy)||1;
    const w=(pts[i].w||s.size)/2;
    L.push({x:pts[i].x-dy/len*w,y:pts[i].y+dx/len*w});
    R.push({x:pts[i].x+dy/len*w,y:pts[i].y-dx/len*w});
  }
  c.beginPath();
  c.moveTo(L[0].x,L[0].y);
  for(let i=1;i<n-1;i++){const mx=(L[i].x+L[i+1].x)/2,my=(L[i].y+L[i+1].y)/2;c.quadraticCurveTo(L[i].x,L[i].y,mx,my);}
  c.lineTo(L[n-1].x,L[n-1].y);
  c.arc(pts[n-1].x,pts[n-1].y,(pts[n-1].w||s.size)/2,
    Math.atan2(L[n-1].y-pts[n-1].y,L[n-1].x-pts[n-1].x),
    Math.atan2(R[n-1].y-pts[n-1].y,R[n-1].x-pts[n-1].x));
  for(let i=n-2;i>0;i--){const mx=(R[i].x+R[i-1].x)/2,my=(R[i].y+R[i-1].y)/2;c.quadraticCurveTo(R[i].x,R[i].y,mx,my);}
  c.lineTo(R[0].x,R[0].y);
  c.arc(pts[0].x,pts[0].y,(pts[0].w||s.size)/2,
    Math.atan2(R[0].y-pts[0].y,R[0].x-pts[0].x),
    Math.atan2(L[0].y-pts[0].y,L[0].x-pts[0].x));
  c.closePath();c.fill();
}
let tmp=document.createElement('canvas'),tctx=tmp.getContext('2d');
/* 텍스트 줄바꿈 — s.wrap(논리 px)이 있으면 그 폭에서 자동 줄바꿈, 없으면 기존처럼 \n만 */
let mcv=document.createElement('canvas'),mctx=mcv.getContext('2d');
function textFont(s){return '600 '+(s.size*1.7)+"px -apple-system,BlinkMacSystemFont,system-ui,'Apple SD Gothic Neo','Malgun Gothic',sans-serif";}
function textLines(s){
  const raw=String(s.text||'').split('\n');
  if(!s.wrap)return raw;
  mctx.font=textFont(s);
  const out=[];
  raw.forEach(ln=>{
    if(!ln||mctx.measureText(ln).width<=s.wrap){out.push(ln);return;}
    let cur='';
    for(const ch of ln){
      if(cur&&mctx.measureText(cur+ch).width>s.wrap){
        const sp=cur.lastIndexOf(' ');
        if(sp>0&&ch!==' '){out.push(cur.slice(0,sp));cur=cur.slice(sp+1)+ch;}
        else{out.push(cur);cur=ch===' '?'':ch;}
      }else cur+=ch;
    }
    out.push(cur);
  });
  return out;
}
function renderStroke(c,s,cw,chh){
  if(s.tool==='hl'){
    const W=cw||cv.width,H=chh||cv.height;
    if(tmp.width!==W||tmp.height!==H){tmp.width=W;tmp.height=H;}
    tctx.setTransform(W/LW,0,0,H/LH,0,0);
    tctx.clearRect(0,0,LW,LH);ribbon(tctx,s);
    c.save();c.globalAlpha=0.38;c.setTransform(1,0,0,1,0,0);c.drawImage(tmp,0,0,W,H);c.restore();
    c.setTransform(W/LW,0,0,H/LH,0,0);
  }else if(s.tool==='eraser'){
    c.save();c.globalCompositeOperation='destination-out';ribbon(c,s);c.restore();
  }else if(s.tool==='pencil'){
    c.save();c.globalAlpha=0.66;ribbon(c,s);c.restore();
  }else if(s.tool==='text'){
    c.save();c.fillStyle=s.color;
    c.font=textFont(s);
    c.textBaseline='top';
    textLines(s).forEach((ln,i)=>c.fillText(ln,s.x,s.y+i*s.size*1.7*1.34));
    c.restore();
  }else ribbon(c,s);
}

/* 잉크는 별도 캔버스에 합성 — 지우개(destination-out)가 배경/PDF를 뚫지 않도록 */
let ink=document.createElement('canvas'),ictx=ink.getContext('2d');
function renderInk(c,W,H,strokes,extra){
  if(ink.width!==W||ink.height!==H){ink.width=W;ink.height=H;}
  ictx.setTransform(1,0,0,1,0,0);ictx.clearRect(0,0,W,H);
  ictx.setTransform(W/LW,0,0,H/LH,0,0);
  (strokes||[]).forEach(s=>renderStroke(ictx,s,W,H));
  if(extra)renderStroke(ictx,extra,W,H);
  c.save();c.setTransform(1,0,0,1,0,0);c.drawImage(ink,0,0);c.restore();
  c.setTransform(W/LW,0,0,H/LH,0,0);
}
function rebuildBase(){
  drawTpl(bctx);
  if(note)renderInk(bctx,base.width,base.height,note.pages[pi].strokes,(live&&live.tool==='eraser')?live:null);
}
function present(){
  ctx.save();ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,cv.width,cv.height);
  ctx.drawImage(base,0,0);ctx.restore();
  ctx.setTransform(cv.width/LW,0,0,cv.height/LH,0,0);
}

/* ============ 입력 v3 — 무보정·증분 렌더·속도 기반 굵기 ============ */
let rect=null, lastT=0, emaW=0, drawnIdx=0;
function widthFor(s,p,speed){
  const baseW=s.tool==='eraser'?s.size:(s.size*(s.tool==='hl'?3.2:s.tool==='pencil'?0.92:1));
  if(s.tool==='hl'||s.tool==='eraser')return baseW;
  const pr=(p==null||p===0)?0.5:p;
  const spd=Math.min(1, speed/2.2);            // 속도 0~2.2u/ms 정규화
  let w=baseW*(0.42+Math.pow(pr,1.35)*1.05)*(1.1-0.46*spd);   // 빠르면 가늘게 (잉크 느낌)
  emaW=emaW===0?w:emaW*0.55+w*0.45;            // 굵기만 부드럽게 (좌표는 무보정)
  return Math.max(0.7,emaW);
}
function toL(e){
  return {x:(e.clientX-rect.left)/rect.width*LW, y:(e.clientY-rect.top)/rect.height*LH, p:e.pressure||0, t:e.timeStamp};
}
function addPoint(e){

    +'#printDoc .pp{width:100%;height:auto;page-break-after:always;display:block;}'
    +'#printDoc .pp:last-child{page-break-after:auto;}}';
  const _t=document.title;document.title=(note.title||'훈련노트');
  window.addEventListener('afterprint',()=>{document.title=_t;},{once:true});setTimeout(()=>{document.title=_t;},30000);
  window.print();};

/* ============ 노트 관리 ============ */
function load(id){
  const s=store();
  note=s.notes[id]||blankNote();
  pi=0;redoStack=[];
  $('nTitle').value=note.title||'';
  refreshTplSel();$('nTpl').value=note.tpl||'blank';
  applyOrient();
  s.cur=note.id;persist(s);
  fit();updateUI();
}
$('newB').onclick=()=>{save();note=blankNote();pi=0;redoStack=[];$('nTitle').value='';$('nTpl').value='blank';applyOrient();save();fit();updateUI();toast('새 노트');};
$('libB').onclick=()=>{renderLib();$('libOvl').classList.add('on');};
$('libClose').onclick=()=>$('libOvl').classList.remove('on');
$('libOvl').addEventListener('click',e=>{if(e.target.id==='libOvl')$('libOvl').classList.remove('on');});
function renderLib(){
  const s=store();const box=$('libList');box.innerHTML='';
  const arr=Object.values(s.notes).sort((a,b)=>b.updated-a.updated);
  if(!arr.length){box.innerHTML='<div style="padding:14px;text-align:center;color:#9097A0;font-size:12.5px">저장된 노트가 없어요</div>';return;}
  arr.forEach(n=>{
    const row=document.createElement('div');row.className='nrow';
    const nm=document.createElement('div');nm.className='nm';
    const b2=document.createElement('b');b2.textContent=n.title||'제목 없음';
    const sp=document.createElement('span');
    const d=new Date(n.updated);
    sp.textContent=(d.getMonth()+1)+'/'+d.getDate()+' · '+n.pages.length;
    nm.append(b2,sp);
    const open=document.createElement('button');open.className='btn pri';open.textContent='열기';
    open.onclick=()=>{save();load(n.id);$('libOvl').classList.remove('on');};
    const del=document.createElement('button');del.className='btn';del.textContent='삭제';
    del.onclick=()=>{if(!confirm('"'+(n.title||'제목 없음')+'" 노트를 삭제할까요?'))return;
      const s2=store();delete s2.notes[n.id];persist(s2);renderLib();
      if(note&&note.id===n.id){note=blankNote();pi=0;redoStack=[];$('nTitle').value='';fit();updateUI();}};
    row.append(nm,open,del);box.appendChild(row);
  });
}

/* ============ 시작 ============ */
(async function(){
  // 로컬 비어있으면 IndexedDB(셸이 로그인 복원 시 기록)에서 하이드레이트
  try{
    if(window.storage){
      var have=null; try{have=localStorage.getItem(KEY);}catch(_){}
      if(!have){ var r=await window.storage.get(KEY); if(r&&r.value){ try{localStorage.setItem(KEY,r.value);}catch(_){} } }
    }
  }catch(_){}
  const s=store();
  if(s.cur&&s.notes[s.cur])load(s.cur);
  else{note=blankNote();refreshTplSel();applyOrient();save();fit();updateUI();}
})();

function ensurePdfjs(){
  return new Promise((res,rej)=>{
    if(window.pdfjsLib)return res(window.pdfjsLib);
    const sc=document.createElement('script');
    sc.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
    sc.onload=async()=>{try{
      const lib=window.pdfjsLib;
      const wurl='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
      try{ // 사파리/아이패드: 교차출처 워커 차단 → blob 워커로 우회
        const r=await fetch(wurl);if(!r.ok)throw 0;
        const code=await r.text();
        lib.GlobalWorkerOptions.workerSrc=URL.createObjectURL(new Blob([code],{type:'text/javascript'}));
      }catch(_){lib.GlobalWorkerOptions.workerSrc=wurl;}
      res(lib);}catch(e){rej(e);}};
    sc.onerror=()=>rej(new Error('offline'));
    document.head.appendChild(sc);
  });
}
$('pdfB').onclick=()=>$('pdfFile').click();
$('pdfFile').addEventListener('change',async function(){
  const f=this.files&&this.files[0];this.value='';if(!f)return;
  toast('PDF 불러오는 중…');
  let lib;
  try{lib=await ensurePdfjs();}catch(e){window.__pdferr=(e&&e.message)||'스크립트 로드 실패';toast('PDF는 인터넷 연결 상태에서 열 수 있어요'+(window.__pdferr?' · '+window.__pdferr:''));return;}
  try{
    const buf=await f.arrayBuffer();
    const doc=await lib.getDocument({data:buf}).promise;
    const total=doc.numPages, MAX=20, cnt=Math.min(total,MAX);
    const pages=[];let bytes=0,firstLand=false;
    for(let i=1;i<=cnt;i++){
      const page=await doc.getPage(i);
      let vp=page.getViewport({scale:1});
      if(i===1)firstLand=vp.width>vp.height;
      const sc=Math.min(LW/vp.width, LH/vp.height)*1.6;   // 선명도 1.6배
      vp=page.getViewport({scale:sc});
      const c2=document.createElement('canvas');c2.width=Math.round(vp.width);c2.height=Math.round(vp.height);
      await page.render({canvasContext:c2.getContext('2d'),viewport:vp}).promise;
      const url=c2.toDataURL('image/jpeg',0.8);
      bytes+=url.length;
      if(bytes>3500000){toast('용량 한도 — '+(i-1)+'쪽까지 불러왔어요');break;}
      pages.push({strokes:[],bg:url});
    }
    if(!pages.length){toast('불러올 수 있는 쪽이 없어요');return;}
    save();
    note=blankNote();
    note.title=(f.name||'PDF').replace(/\.pdf$/i,'');
    note.pages=pages;pi=0;redoStack=[];
    if(firstLand)note.orient='l';
    $('nTitle').value=note.title;$('nTpl').value='blank';
    applyOrient();save();fit();updateUI();
    toast('PDF '+pages.length+'쪽 불러옴 ✓ 위에 바로 필기하세요');
    if(total>MAX)toast('PDF '+pages.length+'쪽 불러옴 (최대 '+MAX+'쪽)');
  }catch(e){toast('PDF를 읽을 수 없어요'+((e&&e.message)?' · '+String(e.message).slice(0,60):''));}
});
